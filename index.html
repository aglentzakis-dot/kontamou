<style>

:root{--brand:#17324D;--brand2:#22476B;--onbrand:#fff;--accent:#F2B632;--onaccent:#17324D;--gold-ink:#A8760B;
  --bg:#EDF1F2;--card:#fff;--ink:#17324D;--mute:#5E7185;--line:#D6DEE3;--red:#C8412B;
  --pro:#17324D;--seek:#2E7D5B;--me:#2468B5;--sh:0 8px 24px rgba(23,50,77,.16);--sh2:0 2px 8px rgba(23,50,77,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0C1823;--card:#132433;--ink:#E4ECF2;--mute:#93A8BA;--line:#253A4D;--gold-ink:#F2B632;--sh:0 8px 24px rgba(0,0,0,.45);--sh2:0 2px 8px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px}
button:active{transform:scale(.98)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
svg.i{width:18px;height:18px;flex:none}


header{background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);color:var(--onbrand);padding:10px 12px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:9px;z-index:600;box-shadow:0 4px 14px rgba(23,50,77,.25)}
.top{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex:none}
.brand{flex:1;min-width:0;line-height:1.1}
.brand b{font-size:19px;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
.acc{background:var(--accent);color:var(--onaccent);border:0;font-weight:700;border-radius:10px;padding:9px 13px;white-space:nowrap;box-shadow:0 2px 8px rgba(242,182,50,.35)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{background:#fff;color:#17324D;border:0;padding-left:40px;height:44px;box-shadow:var(--sh2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:13.5px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.pro{background:#fff;box-shadow:inset 0 0 0 3px var(--pro)}.chip.on .dot.pro{background:var(--pro);box-shadow:none}
.dot.seek{background:var(--seek);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.row2{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.row2:has(#btnClear[hidden]){grid-template-columns:1fr 1fr}
.clearbtn{background:var(--accent);color:var(--onaccent);border:0;font-weight:800;font-size:13px;border-radius:10px;padding:8px 10px;white-space:nowrap}
.clearbtn[hidden]{display:none}
.legend label{display:flex;align-items:center;gap:6px;margin:3px 0 0;padding-top:5px;border-top:1px solid var(--line);font-size:12px;color:var(--ink);font-weight:600;cursor:pointer}
.legend label input{width:auto;margin:0;accent-color:var(--brand)}
.row2 select,.specbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);font-size:13.5px;padding:8px 10px;border-radius:10px}
.row2 select option{color:#17324D;background:#fff}
.specbtn{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.specbtn.on,.row2 select.on{border-color:var(--accent);color:var(--accent);font-weight:700}


.mapwrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;z-index:1;background:#dfe6ea}
.legend{position:absolute;left:10px;top:10px;z-index:500;max-width:min(330px,calc(100% - 70px));max-height:calc(100% - 130px);overflow:auto;background:var(--card);border-radius:12px;box-shadow:var(--sh2);padding:7px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.fab{position:absolute;right:12px;bottom:26px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);color:var(--me);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;padding:0}
.fab.on{background:var(--me);color:#fff}
.pinwrap{position:relative}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 3px 6px rgba(23,50,77,.4)}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:13px}
.pin.pro{background:var(--pro)}.pin.seek{background:var(--seek)}
.pin.feat{width:40px;height:40px;border:3px solid var(--accent);box-shadow:0 0 0 2px #fff,0 4px 10px rgba(23,50,77,.45)}
.pin.feat span{font-size:16px;color:var(--accent)}
.pin.mine{outline:3px solid var(--me);outline-offset:1px}
.fstar{position:absolute;top:-8px;right:-8px;background:var(--accent);color:var(--onaccent);border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.medot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 7px rgba(36,104,181,.25)}
.clus{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(23,50,77,.4)}
.clus b{width:28px;height:28px;border-radius:50%;background:#fff;color:#17324D;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.clus.hasfeat{box-shadow:0 0 0 3px var(--accent),0 3px 8px rgba(23,50,77,.4)}
.leaflet-control-attribution{font-size:10px}


#sheet{background:var(--card);z-index:700;margin-top:-16px;border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(23,50,77,.14);padding-bottom:env(safe-area-inset-bottom);position:relative}
#sheetHead{width:100%;border:0;border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;background:transparent;text-align:left;position:relative}
#sheetHead::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:4px;background:var(--line)}
#sheetHead .n{font-size:17px;font-weight:800}
#sheetHead .s{display:block;font-size:12.5px;color:var(--mute);font-weight:400;margin-top:2px}
#arrow{font-size:13px;font-weight:700;color:var(--brand);background:var(--bg);border-radius:20px;padding:6px 12px;white-space:nowrap}
@media (prefers-color-scheme:dark){#arrow{color:var(--accent)}}
#list{max-height:0;overflow-y:auto;transition:max-height .28s ease}
#sheet.open #list{max-height:50vh}
.item{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.item:active{background:var(--bg)}
.item.feat{background:linear-gradient(90deg,rgba(242,182,50,.16),transparent 70%)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none;position:relative}
.av.pro{background:var(--pro)}.av.seek{background:var(--seek)}
@media (prefers-color-scheme:dark){.av.pro{background:#2B5680}}
.av.feat{box-shadow:0 0 0 3px var(--accent)}
.av .fstar{width:18px;height:18px;font-size:10px;top:-5px;right:-5px}
.item .t{flex:1;min-width:0}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.item small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:1px}
.km{color:var(--brand);font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--bg);border-radius:20px;padding:4px 9px}
@media (prefers-color-scheme:dark){.km{color:var(--ink)}}
.stars{color:#E0A21B;letter-spacing:1px}
.foot{padding:14px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
.foot input{width:auto}
.empty{padding:22px 16px;color:var(--mute);border-top:1px solid var(--line);text-align:center}


#modal{position:fixed;inset:0;background:rgba(12,24,35,.55);z-index:2600;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modal[hidden]{display:none}
.card{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--sh);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:700px){#modal{align-items:center}.card{border-radius:22px}}
.card h2{margin:0 0 4px;font-size:21px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.hero .av{width:64px;height:64px;font-size:22px}
.hero h2{margin:0}
.hero .sp1{color:var(--gold-ink);font-weight:700;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.badge{display:inline-block;font-size:11.5px;padding:4px 9px;border-radius:20px;color:#fff;font-weight:700}
.badge.pro{background:var(--pro)}.badge.seek{background:var(--seek)}.badge.feat{background:var(--accent);color:var(--onaccent)}.badge.ver{background:var(--me)}.badge.demo{background:#8A98A6}
@media (prefers-color-scheme:dark){.badge.pro{background:#2B5680}}
.info{background:var(--bg);border-radius:14px;padding:4px 12px;margin:8px 0}
.info div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.info div:last-child{border-bottom:0}
.info span{color:var(--mute)}.info b{text-align:right;font-weight:600}
.meta{color:var(--mute);font-size:14px;margin:4px 0}
.desc{white-space:pre-wrap;margin:12px 0;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions a,.actions button{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line);color:var(--ink);background:var(--card)}
.actions .wide{grid-column:1/-1}
.actions .call{background:var(--brand);color:#fff;border:0}
@media (prefers-color-scheme:dark){.actions .call{background:#2B5680}}
.actions .gold{background:var(--accent);color:var(--onaccent);border:0}
.actions .viber{background:#7360F2;color:#fff;border:0}.actions .wa{background:#1DA955;color:#fff;border:0}
.actions .danger{color:var(--red)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:11px 8px;border-radius:12px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.locbox{display:flex;flex-wrap:wrap;gap:6px}.locbox button{font-size:13.5px;padding:8px 11px;border-radius:20px}
.locstat{font-size:13px;margin-top:6px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;color:var(--ink);font-weight:400}.chk input{width:auto;accent-color:var(--brand)}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:13px;border-radius:12px;font-weight:600}
button.go{background:var(--brand);color:#fff;border:0;font-weight:700}
@media (prefers-color-scheme:dark){button.go{background:#2B5680}}
.sec{margin-top:16px;font-weight:800;font-size:15px}
.gal{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.gal img{height:110px;border-radius:12px;cursor:pointer;flex:none}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.rev p{margin:4px 0 0;white-space:pre-wrap}
.lock{background:linear-gradient(135deg,rgba(242,182,50,.18),rgba(242,182,50,.06));border:1px solid rgba(242,182,50,.6);border-radius:14px;padding:12px;font-size:13.5px;margin-top:12px;line-height:1.45}
.lock .ff{display:inline-block;margin-top:8px;background:var(--brand);color:var(--accent);border-radius:8px;padding:4px 9px;font-weight:700;font-size:12.5px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumbs div{position:relative}.thumbs img{height:64px;width:64px;object-fit:cover;border-radius:10px}
.thumbs button{position:absolute;top:-6px;right:-6px;padding:0;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:13px}
.starpick{display:flex;gap:2px}.starpick button{font-size:32px;border:0;background:none;color:var(--line);padding:0 4px}.starpick button.on{color:#E0A21B}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;display:flex;align-items:center;justify-content:center}
#viewer[hidden]{display:none}#viewer img{max-width:96vw;max-height:92dvh;border-radius:8px}
#pickBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:1500;background:var(--brand);color:#fff;padding:10px 12px 10px 16px;border-radius:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);width:max-content;max-width:92vw;font-size:14px}
#pickBanner[hidden]{display:none}
#pickPin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:650;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#pickPin[hidden]{display:none}
#pickPin::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:4px;margin-left:-5px;border-radius:50%;background:rgba(0,0,0,.35)}
.picking #sheet,.picking nav,.picking .legend,.picking #btnLoc{display:none}
#pickBanner{flex-direction:column;align-items:stretch;text-align:center;gap:8px;width:min(92vw,420px);top:auto;bottom:calc(18px + env(safe-area-inset-bottom))}
#pickBanner .pb{display:flex;gap:8px}#pickBanner .pb button{flex:1;padding:12px;border-radius:12px}
#pickBanner #pickCancel{background:rgba(255,255,255,.15);color:#fff}
#pickBanner button{background:var(--accent);color:var(--onaccent);border:0;font-weight:700}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--brand);color:#fff;padding:11px 18px;border-radius:12px;z-index:4000;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--sh);font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}


.cathead{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.cathead label{flex:1;margin:0;display:flex;gap:9px;align-items:center;color:var(--ink);font-size:15px;font-weight:700}
.cathead input,.sp input{width:auto;margin:0;accent-color:var(--brand)}
.cathead .tog{border:0;background:none;padding:4px 10px;color:var(--mute)}
.catbody{padding:0 0 6px 28px}.catbody[hidden]{display:none}
.sp{display:flex;align-items:center;gap:9px;margin:0;padding:8px 0;font-size:15px;color:var(--ink);font-weight:400}
.sp[hidden]{display:none}
.cn{margin-left:auto;color:var(--mute);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-weight:600}
.cn.z{opacity:.45}
.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 4px;margin-bottom:-4px}


.welcome{margin:-20px -18px 0;padding:26px 20px 22px;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;border-radius:22px 22px 0 0;text-align:center}
.welcome h2{font-size:23px;line-height:1.25;margin:12px 0 6px}
.welcome p{opacity:.8;margin:0;font-size:14.5px}
.steps{margin:16px 0 4px;display:flex;flex-direction:column;gap:12px}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.steps i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.bigbtn{width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:15.5px;margin-top:10px;border:0}
.bigbtn small{display:block;font-weight:500;font-size:12.5px;opacity:.8;margin-top:2px}


nav{background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:800;position:relative}
nav button{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:8px 1px 8px;color:var(--mute);font-size:clamp(9.5px,2.6vw,12px);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;isolation:isolate}
nav button:active{transform:none}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink);font-weight:800}
nav button.on svg{color:var(--accent);filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
nav button.on::after{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:46px;height:30px;border-radius:10px;background:rgba(242,182,50,.22);z-index:-1}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
nav .cnt{position:absolute;top:3px;left:calc(50% + 10px);background:var(--brand);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:1.3}
@media (prefers-color-scheme:dark){nav .cnt{background:#2B5680}}
.pin span.ic{font-size:13px;line-height:1;width:21px;height:21px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}.pin.feat span.ic{font-size:17px;width:28px;height:28px}
.av.ic{font-size:22px}
.swap{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;margin:10px 0 4px;font-size:14px}
.swap button{background:var(--brand);color:#fff;border:0;font-weight:700;border-radius:10px;padding:9px 12px;white-space:nowrap}
@media (prefers-color-scheme:dark){.swap button{background:#2B5680}}


#start{position:fixed;inset:0;z-index:2500;background:linear-gradient(165deg,#17324D 0%,#22476B 60%,#1B3A58 100%);overflow-y:auto;color:#fff}
#start[hidden]{display:none}
.st-in{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
.st-top{text-align:center;margin:10px 0 18px}
.st-top h1{margin:10px 0 4px;font-size:32px;letter-spacing:.3px}
.st-top p{margin:0;opacity:.75;font-size:15px}
.st-sec{font-size:12.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#F2B632;margin:18px 4px 8px}
.st-btn{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;color:#17324D;border:0;border-radius:16px;padding:14px 14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.st-btn i{font-style:normal;font-size:26px;width:48px;height:48px;border-radius:14px;background:#EDF1F2;display:flex;align-items:center;justify-content:center;flex:none}
.st-btn span{flex:1;min-width:0}.st-btn b{display:block;font-size:17px}.st-btn small{display:block;color:#5E7185;font-size:13px;margin-top:2px}
.st-btn em{font-style:normal;font-size:26px;color:#9AAAB8}
.st-btn.gold{background:#F2B632}.st-btn.gold i{background:rgba(255,255,255,.55)}.st-btn.gold small{color:#5a4410}.st-btn.gold em{color:#17324D}
.st-link{background:none;border:0;color:#fff;opacity:.85;font-weight:700;margin:10px auto 0;padding:12px;font-size:15px}
.st-inst{display:block;width:100%;margin-top:14px;background:rgba(255,255,255,.1);color:#fff;border:1px dashed rgba(255,255,255,.45);border-radius:14px;padding:13px;font-weight:700;font-size:15px}
.st-hint{margin-top:14px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;opacity:.9}
.st-upd{margin-top:8px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:700}
.st-foot{margin-top:auto;padding-top:18px;text-align:center;font-size:12px;opacity:.5}
.logo{cursor:pointer}

.dad{display:block;text-decoration:none;color:#17324D;background:#fff;border-radius:16px;padding:14px;margin-top:16px;box-shadow:0 6px 18px rgba(0,0,0,.22);border:2px solid #F2B632}
.dad img,.dad span:first-child{width:46px;height:46px;border-radius:12px;flex:none;font-size:30px;display:flex;align-items:center;justify-content:center}
.dad-top{display:flex;align-items:center;gap:12px}.dad-top b{display:block;font-size:17px}.dad-top small{color:#5E7185;font-size:13px}
.dad-tag{margin-left:auto;background:#2E7D5B;color:#fff;font-size:11.5px;font-weight:800;border-radius:20px;padding:4px 9px;width:auto!important;height:auto!important}
.dad ul{margin:10px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.7}
.dad-btn{margin-top:10px;background:#17324D;color:#fff;text-align:center;border-radius:12px;padding:11px;font-weight:800}
.dad-pro{margin-top:8px;text-align:center;font-size:12.5px;color:#A8760B;font-weight:700}
.dad.mini{display:flex;align-items:center;gap:12px;margin:0;border-radius:0;box-shadow:none;border:0;border-top:1px solid var(--line);background:linear-gradient(90deg,rgba(242,182,50,.14),transparent);padding:12px 16px;color:var(--ink)}
.dad.mini img,.dad.mini span:first-child{width:38px;height:38px;border-radius:10px;font-size:24px}
.dad.mini span{flex:1}.dad.mini b{display:block;font-size:14.5px}.dad.mini small{color:var(--mute);font-size:12.5px}.dad.mini em{font-style:normal;font-size:22px;color:var(--mute)}
.seg.role button{display:flex;flex-direction:column;gap:3px;text-align:center;padding:12px 8px}.seg.role b{font-size:14.5px}.seg.role small{font-size:12px;opacity:.8;font-weight:400}

#soon{position:absolute;left:12px;right:12px;top:12px;z-index:560;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px;border:2px solid var(--accent);max-width:460px;margin:0 auto}
#soon[hidden]{display:none}
.soon-on .legend{display:none}
.soon-t{font-size:15.5px;line-height:1.35}.soon-n{margin-top:6px;font-size:14px;color:var(--mute)}.soon-n b{color:var(--ink)}
.soon-bar{height:10px;border-radius:10px;background:var(--bg);overflow:hidden;margin:8px 0 4px;border:1px solid var(--line)}
.soon-bar i{display:block;height:100%;background:linear-gradient(90deg,#F2B632,#E0A21B);border-radius:10px}
.soon-s{font-size:12.5px;color:var(--mute)}
.soon-b{display:flex;gap:6px;margin-top:10px}.soon-b button{flex:1;font-size:13px;font-weight:700;padding:10px 6px;border-radius:12px}
#soonJoin,#demoLogin{background:var(--accent);color:var(--onaccent);border:0}
.fbadge{position:absolute;bottom:-4px;left:-8px;font-size:13px;line-height:1;background:#fff;border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.badge.found{background:#8B5E00;color:#fff}
.inv{margin-top:14px;background:var(--bg);border-radius:14px;padding:12px}
.inv-t{font-weight:800;font-size:15.5px}.inv-n{margin-top:6px;font-size:14px}
.inv-b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.inv-b a{text-align:center;text-decoration:none;color:#fff;font-weight:700;padding:10px 4px;border-radius:10px;font-size:13.5px}
.inv-b .viber{background:#7360F2}.inv-b .msg{background:#0A7CFF}.inv-b .wa{background:#1DA955}
.inv-c{width:100%;margin-top:6px;border-radius:10px;font-weight:600}
.adm-r{border-top:1px solid var(--line);padding:10px 0}.adm-h{display:flex;justify-content:space-between;align-items:center}
.adm-c{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}.adm-c input{width:80px;padding:6px 8px}.adm-c button{font-size:12.5px;padding:6px 10px}
.st-prog{margin-top:6px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45}
.st-prog .soon-bar{background:rgba(255,255,255,.15);border:0}

.cinfo{grid-column:1/-1;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.cinfo.ok{background:rgba(46,125,91,.12);color:var(--seek);font-weight:700}
details.fx{border:1.5px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card)}
details.fx[open]{border-color:var(--brand)}
details.fx>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
details.fx>summary::-webkit-details-marker{display:none}
details.fx>summary::after{content:"▾";margin-left:auto;color:var(--mute);font-weight:800;flex:none}
details.fx[open]>summary::after{content:"▴"}
.fxi{font-size:20px;width:26px;text-align:center;flex:none}.fxt{min-width:0}.fxt b{display:block;font-size:15px}
.fxt small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:1px}
.fxb{padding:0 12px 12px;border-top:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr) 10px minmax(0,1fr);gap:5px;align-items:center;margin:6px 0}
.hrow label{display:flex;align-items:center;gap:6px;margin:0;font-weight:600}.hrow label input{width:auto;margin:0}
.hrow input[type=time]{width:100%;min-width:0;padding:7px 4px;margin:0;font-size:14px}
.hpre{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.hpre button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.phst{font-size:13px;border-radius:10px;padding:7px 10px;margin:4px 0}.phst.ok{color:#2E7D4F;background:rgba(46,158,98,.10)}.phst.bad{color:#C0392B;background:rgba(192,57,43,.10);border:1.5px solid #C0392B}
.pmenu{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pmenu button .fxi{font-size:20px}.pmenu button em{margin-left:auto;font-style:normal;color:var(--mute);font-weight:800;flex:none}
.imr{background:linear-gradient(135deg,rgba(242,182,50,.14),rgba(36,104,181,.08));border:1.5px solid rgba(242,182,50,.5);border-radius:14px;padding:12px;font-size:14px;line-height:1.45;color:var(--ink)}
.imr .btns a.go{background:var(--accent);color:var(--onaccent);padding:11px 14px;border-radius:12px;font-weight:800;display:block;flex:1}
.imr small{display:block;color:var(--mute);margin-top:6px;font-size:12.5px}.imr .btns a{text-decoration:none;text-align:center}
.imr-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px dashed rgba(242,182,50,.8);background:rgba(242,182,50,.08);color:var(--ink);text-decoration:none}
.imr-row em{margin-left:auto;font-style:normal;color:var(--mute);font-weight:800}
.pmenu .ph{font-weight:800;font-size:15px;margin:6px 0 0}
.fsec{margin:18px 0 2px;padding-top:12px;border-top:1px solid var(--line);font-weight:800;font-size:15px}
.chk span{line-height:1.4}.chk.terms{background:var(--bg);border-radius:12px;padding:10px}
.inbox,.admbox{background:var(--bg);border-radius:14px;padding:12px;margin:10px 0}
.admbox{border:2px dashed var(--me)}
.worldbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:7px 11px;font-weight:700;font-size:13.5px;white-space:nowrap;flex:none}
.worldbtn span{opacity:.7;font-size:11px}
.wpick{display:grid;gap:8px;margin-top:12px}
.wpick button{display:flex;gap:12px;align-items:center;text-align:left;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.wpick button.on{border-color:var(--accent);background:rgba(242,182,50,.12)}
.wpick i{font-style:normal;font-size:28px}.wpick b{display:block;font-size:16px}.wpick small{display:block;color:var(--mute);font-size:12.5px}
.st-worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 2px}
.st-worlds button{background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 4px;font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.st-worlds button i{font-style:normal;font-size:24px}
.st-worlds button{border-top:4px solid var(--wc,rgba(255,255,255,.18))}
.st-worlds button.on{background:var(--wc,#F2B632);color:#fff;border-color:var(--wc,#F2B632);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.st-worlds button.all.on{color:#17324D;text-shadow:none}
.st-worlds button.all{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px}
.wpick button{border-left:6px solid var(--wc,var(--line))}
.pin.anon{opacity:.78;border-style:dashed}.wdot.anon{opacity:.75}
.pinwrap.closed,.wdot.closed{filter:grayscale(.85);opacity:.55}
.clsd{color:#C0392B !important;font-weight:700}
.badge.closed{background:#C0392B;color:#fff}
.paw{color:transparent !important;text-shadow:0 0 0 #F2B632;font-size:1.18em;display:inline-block;line-height:1}
.hidden-red{color:#C0392B;font-weight:800}
.wdot{width:100%;height:100%;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(23,50,77,.5);box-sizing:border-box}
.wdot.feat{border:3px solid var(--accent)}.wdot.seek{background:#fff;border-width:4px}.wdot.mine{outline:2px solid var(--me);outline-offset:1px}
.wdot.today{box-shadow:0 0 0 2px #2EBD6B,0 1px 4px rgba(23,50,77,.5)}
.lgw{display:flex;flex-direction:column;gap:2px}
.lgw button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:5px 2px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left;border-radius:8px}
.lgw button:active{background:var(--bg)}.lgw button small{margin-left:auto;font-weight:800;color:var(--mute);font-size:11.5px;padding-left:8px}
.lgw button small+em{margin-left:0;padding-left:6px}.lgw button.on{background:var(--bg);font-weight:800}.lgw button:disabled{opacity:.4;cursor:default}
.lgh{font-size:11px;font-weight:800;color:var(--mute);text-transform:none;margin-top:2px}.lgw button em{margin-left:auto;font-style:normal;color:var(--mute);font-weight:800;padding-left:10px}
.lgtog{display:flex;align-items:center;gap:6px;border:0;background:none;box-shadow:none;border-radius:0;min-height:0;font:inherit;font-size:12px;color:var(--ink);padding:0;cursor:pointer}
.lgtog b{font-weight:700}.lgtog.act b::after{content:" · 🟢 σήμερα"}.lgtog em{font-style:normal;color:var(--mute)}
#lgDots{display:flex;gap:2px}#lgDots i{width:9px;height:9px}
.legend.min{padding:6px 10px;border-radius:99px;opacity:.92}.legend.min .lgbody{display:none}
.legend:not(.min) .lgtog{padding-bottom:5px;margin-bottom:2px;border-bottom:1px solid var(--line);width:100%}
.lgbody{display:flex;flex-direction:column;gap:4px}
.st-worlds button{position:relative}
.wrow{display:grid;gap:4px}.wrow .wedit{border:0;background:none;color:var(--me);font:inherit;font-weight:700;font-size:13.5px;text-align:right;padding:2px 6px 6px;cursor:pointer}
.wtools{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.wtools button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 10px;font-weight:800;cursor:pointer;color:var(--ink)}
.wtools button:disabled{opacity:.35}.wtools .wedit{border:0;background:none;color:var(--me)}
.cg{border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin:10px 0}
.cgh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0}
.tb{display:flex;gap:3px;flex:none}.tb button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:3px 7px;font-size:13px;cursor:pointer;color:var(--ink)}
.tb button:disabled{opacity:.3}
.tnew{background:var(--bg);border-radius:14px;padding:10px 12px;margin:10px 0}
.trow{display:grid;grid-template-columns:64px 1fr;gap:6px}.trow input{min-width:0}
.tedit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--line);font-size:14.5px}
.tedit span:first-child{min-width:0}.st-worlds button em{position:absolute;top:3px;right:5px;font-style:normal;font-size:11px}
.st-lock{font-size:12.5px;opacity:.8;margin:6px 4px 0;line-height:1.4}
.st-soon{margin:12px 0 0;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13.5px;line-height:1.5}
.sug{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.sug:empty{display:none}.sug span{font-size:13px;color:var(--mute)}
.sug button{padding:7px 11px;border-radius:20px;border:2px solid var(--accent);background:rgba(242,182,50,.14);color:var(--ink);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.worldbtn[hidden]{display:none}
.st-avail{width:100%;margin:-4px 0 10px;padding:11px 14px;border-radius:14px;border:2px dashed rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.st-avail.on{border:2px solid #3DBE7A;background:rgba(61,190,122,.18)}
.wsel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wsel button{padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.wsel button.on{border-color:var(--accent);background:rgba(242,182,50,.16)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--line);border-radius:20px;font-size:14px;margin:0;cursor:pointer}
.availbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;margin:10px 0}
.availbtn b{display:block;font-size:15px}.availbtn small{display:block;color:var(--mute);font-size:12.5px}
.availbtn .ic{font-size:22px;flex:none}.availbtn .pill{margin-left:auto;flex:none;font-weight:800;font-size:12px;padding:4px 9px;border-radius:99px;background:var(--line);color:var(--mute)}
.availbtn.on{border-color:#2E9E62;background:rgba(46,158,98,.10)}.availbtn.on .pill{background:#2E9E62;color:#fff}
.badge.today{background:#2E9E62;color:#fff}
.tday{color:#2E9E62;font-weight:800}
.item small.pr{color:var(--gold-ink);font-weight:700}
.tdot{position:absolute;bottom:-3px;right:-5px;width:13px;height:13px;border-radius:50%;background:#2EBD6B;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.safe{background:rgba(36,104,181,.08);border:1px solid rgba(36,104,181,.3);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin:10px 0}
body.picking .needfab{display:none}
nav button[hidden]{display:none}
.legend [hidden]{display:none}
.cat.off .cathead,.sp.off{opacity:.45}.sp.off{cursor:default}
.needfab{position:absolute;left:12px;bottom:26px;z-index:500;border:0;border-radius:24px;padding:12px 16px;background:var(--accent);color:var(--onaccent);font-weight:800;font-size:15px;box-shadow:var(--sh);display:flex;align-items:center;gap:6px;cursor:pointer}
.needfab b{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.needfab b[hidden]{display:none}
.need{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:10px 0;background:var(--card)}
.need.closed{opacity:.65}
.need .nh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.need .nh small{color:var(--mute);font-size:12.5px;white-space:nowrap}
.need p{margin:6px 0;white-space:pre-wrap;font-size:14.5px}
.ansr{background:var(--bg);border-radius:12px;padding:9px 10px;margin:6px 0}.ansr p{margin:4px 0;white-space:pre-wrap;font-size:14px}
.rqb a{flex:1;font-size:13px;padding:8px;border-radius:10px;font-weight:700;text-align:center;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
.rqb a.call,.rqb button.call{background:var(--brand);color:#fff;border:0}
.acct{display:grid;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.acct button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.acct button b{display:block;font-size:15px}.acct button small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;line-height:1.4}
.acct button.del{border-color:rgba(200,65,43,.35)}.acct button.del b{color:var(--red)}
.admst{display:grid;gap:8px;margin-top:10px}
.admst button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.admst button b{font-size:15px;display:block}.admst button small{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.admst button .ic{font-size:22px;width:28px;text-align:center;flex:none}
.admst button .pill{margin-left:auto;flex:none;font-weight:800;font-size:12px;padding:4px 9px;border-radius:99px;background:var(--line);color:var(--mute)}
.admst button.on-ver{border-color:var(--seek);background:rgba(46,125,91,.10)}.admst button.on-ver .pill{background:var(--seek);color:#fff}
.admst button.on-pro{border-color:var(--accent);background:rgba(242,182,50,.16)}.admst button.on-pro .pill{background:var(--accent);color:var(--onaccent)}
.admst button.on-hide{border-color:var(--red);background:rgba(200,65,43,.09)}.admst button.on-hide .pill{background:var(--red);color:#fff}
.admst button.del{border-color:transparent;color:var(--red);justify-content:center;font-weight:700}
.admst button:disabled{opacity:.55}
#ask[hidden],#askNo[hidden]{display:none}
#ask{position:fixed;inset:0;z-index:3800;background:rgba(12,24,35,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#ask .box{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;max-width:380px;width:100%;box-shadow:var(--sh)}
#ask h3{margin:0 0 6px;font-size:18px}#ask p{margin:0 0 12px;color:var(--mute);font-size:14.5px;line-height:1.45}
#ask input{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:12px;background:var(--bg);color:var(--ink)}
#askQ{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}#askQ[hidden],#askL[hidden],#askW[hidden]{display:none}
#askQ button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
#askQ.one{grid-template-columns:1fr}
#askQ button.sel{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
#askL{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
#askW{font-weight:700;margin:-4px 0 12px;font-size:14.5px}
#ask .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ask .row button{padding:13px;border-radius:12px;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#ask .row button.ok{background:var(--brand);color:#fff;border:0}#ask .row button.ok.red{background:var(--red)}
.rq{border-top:1px solid var(--line);padding:9px 0;font-size:14px}.rq p{margin:4px 0;white-space:pre-wrap}
.rq.pending{background:rgba(242,182,50,.1);margin:0 -6px;padding:9px 6px;border-radius:10px}
.rqb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.rqb button{flex:1;font-size:13px;padding:8px;border-radius:10px;font-weight:700}
.admtabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0;scrollbar-width:none}.admtabs button{white-space:nowrap;font-size:13px;border-radius:20px;padding:7px 12px}
.admtabs button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.adm-u{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.adm-u .av{width:40px;height:40px}.adm-u .t{flex:1;min-width:0}.adm-u b{display:block}.adm-u small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flags{font-size:15px;white-space:nowrap}.flags .rep{background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:12px;margin-left:3px}
.adm-rep{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.adm-rep p{margin:4px 0}
.adm-log div{border-top:1px solid var(--line);padding:7px 0;font-size:13.5px}.adm-log small{color:var(--mute);margin-right:6px}
.st-acct{margin-top:14px;text-align:center;font-size:13px;opacity:.9}.st-acct button{background:none;border:0;color:#F2B632;font-weight:700;padding:0;font-size:13px}
nav .cnt.req{background:var(--red)}
#docv{position:fixed;inset:0;z-index:3500;background:rgba(12,24,35,.6);display:flex;align-items:flex-end;justify-content:center}
#docv[hidden]{display:none}
#docv .card{max-height:88dvh}
.doc h3{margin:16px 0 4px;font-size:15.5px}.doc p,.doc li{font-size:14px;line-height:1.55;color:var(--ink)}.doc ul{padding-left:20px;margin:4px 0}
@media(min-width:700px){#docv{align-items:center}}

.tradebtn{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--bg);font-weight:600}.tradebtn span{color:var(--mute)}
.cardcv{width:100%;height:auto;border-radius:14px;box-shadow:var(--sh);margin:12px 0 4px;display:block;background:#fff}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo" id="logoHome" title="Αρχική"><img src="pineza-g.png" width="24" height="29" alt="" style="display:block"></div>
    <div class="brand"><b>Κοντά μου</b><small>από το Δρομολόγιο · <span id="ver"></span></small></div>
    <button id="btnWorld" class="worldbtn" type="button">🔧 Μάστορες <span>▾</span></button>
  </div>
  <div class="search">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Τι ψάχνεις; π.χ. υδραυλικός, Βύρωνας…">
  </div>
  <div class="row2">
    <button id="btnSpec" class="specbtn">Επαγγέλματα: όλα ▾</button>
    <select id="radius">
      <option value="0">Κάθε απόσταση</option>
      <option value="2">Έως 2 χλμ</option>
      <option value="5">Έως 5 χλμ</option>
      <option value="10">Έως 10 χλμ</option>
      <option value="25">Έως 25 χλμ</option>
      <option value="50">Έως 50 χλμ</option>
    </select>
    <button id="btnClear" class="clearbtn" hidden title="Εκκαθάριση φίλτρων">✕ Όλα</button>
  </div>
</header>

<div class="mapwrap">
  <div id="map"></div>
  <div class="legend min" id="legend">
    <button id="lgTog" type="button" class="lgtog"><span id="lgDots"></span><b>Υπόμνημα</b><em>▾</em></button>
    <div class="lgbody">
    <span><i style="background:var(--pro)"></i><b id="lgPro" style="font-weight:inherit">Επαγγελματίες</b></span>
    <span id="lgSeek"><i style="background:var(--seek)"></i>Ζητούν εργασία</span>
    <div id="lgWorlds" class="lgw" hidden></div>
    <span><i style="background:#fff;border:3px solid var(--accent);box-sizing:border-box"></i>★ Προνομιακή προβολή</span>
    <label><input type="checkbox" id="chkAll" checked> Όλοι στον χάρτη</label>
    <label><input type="checkbox" id="chkToday"> 🟢 Διαθέσιμοι σήμερα</label>
    </div>
  </div>
  <button id="btnNeed" class="needfab" type="button">📣 Ζήτα<b id="nNeed" hidden></b></button>
  <div id="pickPin" hidden><img src="pineza-g.png" width="44" height="54" alt="" style="display:block"></div>
  <div id="soon" hidden></div>
  <button id="btnLoc" class="fab" title="Η θέση μου"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<div id="sheet">
  <button id="sheetHead"><span><span class="n" id="count">…</span><span class="s" id="count2"></span></span><span id="arrow">Λίστα ▲</span></button>
  <div id="list"></div>
</div>

<nav id="nav">
  <button data-t="all" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>Όλοι</span><b class="cnt" id="nAll"></b></button>
  <button data-t="pro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span id="navProTxt">Μάστορες</span><b class="cnt" id="nPro"></b></button>
  <button data-t="seek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12h18"/></svg><span>Εργασία</span><b class="cnt" id="nSeek"></b></button>
  <button data-t="feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Προνομιακοί</span></button>
  <button id="navMe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="navMeTxt">Προφίλ</span><b class="cnt req" id="nReq" hidden></b></button>
</nav>

<div id="pickBanner" hidden><b>Μετακίνησε τον χάρτη ώστε η πινέζα να δείχνει το σημείο σου</b><small style="opacity:.8">Μπορείς και να πατήσεις κάπου για να πάει εκεί</small><div class="pb"><button id="pickCancel">Άκυρο</button><button id="pickOk">✓ Εδώ είναι</button></div></div>
<div id="start" hidden></div>
<div id="docv" hidden><div class="card doc" id="docCard"></div></div>
<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="toast"></div>
<div id="ask" hidden><div class="box" role="dialog" aria-modal="true"><h3 id="askT"></h3><p id="askP"></p><div id="askQ" hidden></div><label id="askL" hidden>ή διάλεξε ακριβή ημερομηνία:</label><input id="askIn" type="date" hidden><div id="askW" hidden></div><div class="row"><button id="askNo" type="button">Άκυρο</button><button id="askOk" class="ok" type="button"></button></div></div></div>
