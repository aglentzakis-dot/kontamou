<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Κοντά μου</title>
<meta name="description" content="Οι μάστορες της γειτονιάς σου και όσοι ζητούν δουλειά, σε έναν χάρτη.">
<meta name="theme-color" content="#17324D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Κοντά μου">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317324D'/%3E%3Cpath d='M32 12a14 14 0 0 1 14 14c0 11-14 26-14 26S18 37 18 26a14 14 0 0 1 14-14z' fill='%23F2B632'/%3E%3Ccircle cx='32' cy='26' r='5.5' fill='%2317324D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
/* Χρώματα Δρομολογίου */
:root{--brand:#17324D;--brand2:#22476B;--onbrand:#fff;--accent:#F2B632;--onaccent:#17324D;--gold-ink:#A8760B;
  --bg:#EDF1F2;--card:#fff;--ink:#17324D;--mute:#5E7185;--line:#D6DEE3;--red:#C8412B;
  --pro:#17324D;--seek:#2E7D5B;--me:#2468B5;--sh:0 8px 24px rgba(23,50,77,.16);--sh2:0 2px 8px rgba(23,50,77,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0C1823;--card:#132433;--ink:#E4ECF2;--mute:#93A8BA;--line:#253A4D;--gold-ink:#F2B632;--sh:0 8px 24px rgba(0,0,0,.45);--sh2:0 2px 8px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px}
button:active{transform:scale(.98)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
svg.i{width:18px;height:18px;flex:none}

/* Κεφαλίδα */
header{background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);color:var(--onbrand);padding:10px 12px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:9px;z-index:600;box-shadow:0 4px 14px rgba(23,50,77,.25)}
.top{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex:none}
.brand{flex:1;min-width:0;line-height:1.1}
.brand b{font-size:19px;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
.acc{background:var(--accent);color:var(--onaccent);border:0;font-weight:700;border-radius:10px;padding:9px 13px;white-space:nowrap;box-shadow:0 2px 8px rgba(242,182,50,.35)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{background:#fff;color:#17324D;border:0;padding-left:40px;height:44px;box-shadow:var(--sh2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:13.5px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.pro{background:#fff;box-shadow:inset 0 0 0 3px var(--pro)}.chip.on .dot.pro{background:var(--pro);box-shadow:none}
.dot.seek{background:var(--seek);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row2 select,.specbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);font-size:13.5px;padding:8px 10px;border-radius:10px}
.row2 select option{color:#17324D;background:#fff}
.specbtn{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.specbtn.on,.row2 select.on{border-color:var(--accent);color:var(--accent);font-weight:700}

/* Χάρτης */
.mapwrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;z-index:1;background:#dfe6ea}
.legend{position:absolute;left:10px;top:10px;z-index:500;background:var(--card);border-radius:12px;box-shadow:var(--sh2);padding:7px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.fab{position:absolute;right:12px;bottom:26px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);color:var(--me);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;padding:0}
.fab.on{background:var(--me);color:#fff}
.pinwrap{position:relative}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 3px 6px rgba(23,50,77,.4)}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:13px}
.pin.pro{background:var(--pro)}.pin.seek{background:var(--seek)}
.pin.feat{width:40px;height:40px;border:3px solid var(--accent);box-shadow:0 0 0 2px #fff,0 4px 10px rgba(23,50,77,.45)}
.pin.feat span{font-size:16px;color:var(--accent)}
.pin.mine{outline:3px solid var(--me);outline-offset:1px}
.fstar{position:absolute;top:-8px;right:-8px;background:var(--accent);color:var(--onaccent);border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.medot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 7px rgba(36,104,181,.25)}
.clus{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(23,50,77,.4)}
.clus b{width:28px;height:28px;border-radius:50%;background:#fff;color:#17324D;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.clus.hasfeat{box-shadow:0 0 0 3px var(--accent),0 3px 8px rgba(23,50,77,.4)}
.leaflet-control-attribution{font-size:10px}

/* Κάτω φύλλο */
#sheet{background:var(--card);z-index:700;margin-top:-16px;border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(23,50,77,.14);padding-bottom:env(safe-area-inset-bottom);position:relative}
#sheetHead{width:100%;border:0;border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;background:transparent;text-align:left;position:relative}
#sheetHead::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:4px;background:var(--line)}
#sheetHead .n{font-size:17px;font-weight:800}
#sheetHead .s{display:block;font-size:12.5px;color:var(--mute);font-weight:400;margin-top:2px}
#arrow{font-size:13px;font-weight:700;color:var(--brand);background:var(--bg);border-radius:20px;padding:6px 12px;white-space:nowrap}
@media (prefers-color-scheme:dark){#arrow{color:var(--accent)}}
#list{max-height:0;overflow-y:auto;transition:max-height .28s ease}
#sheet.open #list{max-height:50vh}
.item{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.item:active{background:var(--bg)}
.item.feat{background:linear-gradient(90deg,rgba(242,182,50,.16),transparent 70%)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none;position:relative}
.av.pro{background:var(--pro)}.av.seek{background:var(--seek)}
@media (prefers-color-scheme:dark){.av.pro{background:#2B5680}}
.av.feat{box-shadow:0 0 0 3px var(--accent)}
.av .fstar{width:18px;height:18px;font-size:10px;top:-5px;right:-5px}
.item .t{flex:1;min-width:0}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.item small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:1px}
.km{color:var(--brand);font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--bg);border-radius:20px;padding:4px 9px}
@media (prefers-color-scheme:dark){.km{color:var(--ink)}}
.stars{color:#E0A21B;letter-spacing:1px}
.foot{padding:14px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
.foot input{width:auto}
.empty{padding:22px 16px;color:var(--mute);border-top:1px solid var(--line);text-align:center}

/* Παράθυρα */
#modal{position:fixed;inset:0;background:rgba(12,24,35,.55);z-index:2000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modal[hidden]{display:none}
.card{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--sh);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:700px){#modal{align-items:center}.card{border-radius:22px}}
.card h2{margin:0 0 4px;font-size:21px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.hero .av{width:64px;height:64px;font-size:22px}
.hero h2{margin:0}
.hero .sp1{color:var(--gold-ink);font-weight:700;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.badge{display:inline-block;font-size:11.5px;padding:4px 9px;border-radius:20px;color:#fff;font-weight:700}
.badge.pro{background:var(--pro)}.badge.seek{background:var(--seek)}.badge.feat{background:var(--accent);color:var(--onaccent)}.badge.ver{background:var(--me)}.badge.demo{background:#8A98A6}
@media (prefers-color-scheme:dark){.badge.pro{background:#2B5680}}
.info{background:var(--bg);border-radius:14px;padding:4px 12px;margin:8px 0}
.info div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.info div:last-child{border-bottom:0}
.info span{color:var(--mute)}.info b{text-align:right;font-weight:600}
.meta{color:var(--mute);font-size:14px;margin:4px 0}
.desc{white-space:pre-wrap;margin:12px 0;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions a,.actions button{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line);color:var(--ink);background:var(--card)}
.actions .wide{grid-column:1/-1}
.actions .call{background:var(--brand);color:#fff;border:0}
@media (prefers-color-scheme:dark){.actions .call{background:#2B5680}}
.actions .gold{background:var(--accent);color:var(--onaccent);border:0}
.actions .viber{background:#7360F2;color:#fff;border:0}.actions .wa{background:#1DA955;color:#fff;border:0}
.actions .danger{color:var(--red)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:11px 8px;border-radius:12px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.locbox{display:flex;flex-wrap:wrap;gap:6px}.locbox button{font-size:13.5px;padding:8px 11px;border-radius:20px}
.locstat{font-size:13px;margin-top:6px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;color:var(--ink);font-weight:400}.chk input{width:auto;accent-color:var(--brand)}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:13px;border-radius:12px;font-weight:600}
button.go{background:var(--brand);color:#fff;border:0;font-weight:700}
@media (prefers-color-scheme:dark){button.go{background:#2B5680}}
.sec{margin-top:16px;font-weight:800;font-size:15px}
.gal{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.gal img{height:110px;border-radius:12px;cursor:pointer;flex:none}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.rev p{margin:4px 0 0;white-space:pre-wrap}
.lock{background:linear-gradient(135deg,rgba(242,182,50,.18),rgba(242,182,50,.06));border:1px solid rgba(242,182,50,.6);border-radius:14px;padding:12px;font-size:13.5px;margin-top:12px;line-height:1.45}
.lock .ff{display:inline-block;margin-top:8px;background:var(--brand);color:var(--accent);border-radius:8px;padding:4px 9px;font-weight:700;font-size:12.5px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumbs div{position:relative}.thumbs img{height:64px;width:64px;object-fit:cover;border-radius:10px}
.thumbs button{position:absolute;top:-6px;right:-6px;padding:0;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:13px}
.starpick{display:flex;gap:2px}.starpick button{font-size:32px;border:0;background:none;color:var(--line);padding:0 4px}.starpick button.on{color:#E0A21B}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;display:flex;align-items:center;justify-content:center}
#viewer[hidden]{display:none}#viewer img{max-width:96vw;max-height:92dvh;border-radius:8px}
#pickBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:1500;background:var(--brand);color:#fff;padding:10px 12px 10px 16px;border-radius:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);width:max-content;max-width:92vw;font-size:14px}
#pickBanner[hidden]{display:none}
#pickPin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:650;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#pickPin[hidden]{display:none}
#pickPin::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:4px;margin-left:-5px;border-radius:50%;background:rgba(0,0,0,.35)}
.picking #sheet,.picking nav,.picking .legend,.picking #btnLoc{display:none}
#pickBanner{flex-direction:column;align-items:stretch;text-align:center;gap:8px;width:min(92vw,420px);top:auto;bottom:calc(18px + env(safe-area-inset-bottom))}
#pickBanner .pb{display:flex;gap:8px}#pickBanner .pb button{flex:1;padding:12px;border-radius:12px}
#pickBanner #pickCancel{background:rgba(255,255,255,.15);color:#fff}
#pickBanner button{background:var(--accent);color:var(--onaccent);border:0;font-weight:700}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--brand);color:#fff;padding:11px 18px;border-radius:12px;z-index:4000;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--sh);font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}

/* Φίλτρο επαγγελμάτων */
.cathead{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.cathead label{flex:1;margin:0;display:flex;gap:9px;align-items:center;color:var(--ink);font-size:15px;font-weight:700}
.cathead input,.sp input{width:auto;margin:0;accent-color:var(--brand)}
.cathead .tog{border:0;background:none;padding:4px 10px;color:var(--mute)}
.catbody{padding:0 0 6px 28px}.catbody[hidden]{display:none}
.sp{display:flex;align-items:center;gap:9px;margin:0;padding:8px 0;font-size:15px;color:var(--ink);font-weight:400}
.sp[hidden]{display:none}
.cn{margin-left:auto;color:var(--mute);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-weight:600}
.cn.z{opacity:.45}
.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 4px;margin-bottom:-4px}

/* Καλωσόρισμα */
.welcome{margin:-20px -18px 0;padding:26px 20px 22px;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;border-radius:22px 22px 0 0;text-align:center}
.welcome h2{font-size:23px;line-height:1.25;margin:12px 0 6px}
.welcome p{opacity:.8;margin:0;font-size:14.5px}
.steps{margin:16px 0 4px;display:flex;flex-direction:column;gap:12px}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.steps i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.bigbtn{width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:15.5px;margin-top:10px;border:0}
.bigbtn small{display:block;font-weight:500;font-size:12.5px;opacity:.8;margin-top:2px}

/* Κάτω μπάρα (όπως στο Δρομολόγιο) */
nav{background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:800;position:relative}
nav button{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:8px 1px 8px;color:var(--mute);font-size:clamp(9.5px,2.6vw,12px);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;isolation:isolate}
nav button:active{transform:none}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink);font-weight:800}
nav button.on svg{color:var(--accent);filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
nav button.on::after{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:46px;height:30px;border-radius:10px;background:rgba(242,182,50,.22);z-index:-1}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
nav .cnt{position:absolute;top:3px;left:calc(50% + 10px);background:var(--brand);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:1.3}
@media (prefers-color-scheme:dark){nav .cnt{background:#2B5680}}
.pin span.ic{font-size:13px;line-height:1;width:21px;height:21px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}.pin.feat span.ic{font-size:17px;width:28px;height:28px}
.av.ic{font-size:22px}
.swap{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;margin:10px 0 4px;font-size:14px}
.swap button{background:var(--brand);color:#fff;border:0;font-weight:700;border-radius:10px;padding:9px 12px;white-space:nowrap}
@media (prefers-color-scheme:dark){.swap button{background:#2B5680}}

/* Αρχική σελίδα */
#start{position:fixed;inset:0;z-index:2500;background:linear-gradient(165deg,#17324D 0%,#22476B 60%,#1B3A58 100%);overflow-y:auto;color:#fff}
#start[hidden]{display:none}
.st-in{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
.st-top{text-align:center;margin:10px 0 18px}
.st-top h1{margin:10px 0 4px;font-size:32px;letter-spacing:.3px}
.st-top p{margin:0;opacity:.75;font-size:15px}
.st-sec{font-size:12.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#F2B632;margin:18px 4px 8px}
.st-btn{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;color:#17324D;border:0;border-radius:16px;padding:14px 14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.st-btn i{font-style:normal;font-size:26px;width:48px;height:48px;border-radius:14px;background:#EDF1F2;display:flex;align-items:center;justify-content:center;flex:none}
.st-btn span{flex:1;min-width:0}.st-btn b{display:block;font-size:17px}.st-btn small{display:block;color:#5E7185;font-size:13px;margin-top:2px}
.st-btn em{font-style:normal;font-size:26px;color:#9AAAB8}

const ico = id => (profById(id) || {}).e || "🛠️";

const profsOfCat = cid => PROFS.filter(p => p.c === cid).sort((x,y) => (x.id==="other")-(y.id==="other") || x.n.localeCompare(y.n,"el"));
const tradesOf = p => (p.trades && p.trades.length) ? p.trades : ["other"];

const tLabel = (p, id) => id === "other" && p.customName ? p.customName : tName(id);
const specTxt = p => tradesOf(p).map(id => tLabel(p,id)).join(" · ");

const LIC_SALT = "dromologio-2026-kleidi";
const licNorm = s => String(s||"").toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩΆΈΉΊΌΎΏ]/g,"");
function licHash(str){ let h = 2166136261>>>0; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619)>>>0; } return h>>>0; }
const lic36 = (n,len) => n.toString(36).toUpperCase().padStart(len,"0").slice(-len);
function licMake(name, until){
  const base = licNorm(name) + "|" + until + "|" + LIC_SALT;
  const d = until.slice(2,4) + until.slice(5,7) + until.slice(8,10);
  return "DR-" + d + "-" + lic36(licHash(base),6) + "-" + lic36(licHash(base + "#2"),4);
}
function licCheck(name, key){
  const k = String(key||"").toUpperCase().replace(/\s+/g,"");
  const m = /^DR-(\d{6})-([0-9A-Z]{6})-([0-9A-Z]{4})$/.exec(k);
  if (!m) return "";
  const until = "20" + m[1].slice(0,2) + "-" + m[1].slice(2,4) + "-" + m[1].slice(4,6);
  return licMake(name, until) === k ? until : "";
}
const todayISO = () => new Date().toISOString().slice(0,10);

  const mine = Cloud.refs.filter(r => r.by === uid).sort((a,b) => (a.at||0) - (b.at||0));
  let end = 0; const MONTH = 30*864e5;
  mine.forEach(r => { end = Math.max(end, r.at || 0) + MONTH; });
  return {n: mine.length, until: end};
}

async function cloudInit(){
  if (!FIREBASE_CONFIG) return false;
  const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
  try {
    await loadScript(FB + "firebase-app-compat.js");
    await Promise.all([loadScript(FB + "firebase-auth-compat.js"), loadScript(FB + "firebase-firestore-compat.js")]);
    firebase.initializeApp(FIREBASE_CONFIG);
    Cloud.auth = firebase.auth(); Cloud.db = firebase.firestore(); Cloud.on = true;
    try { await Cloud.auth.getRedirectResult(); } catch(e){}
    let first; const ready = new Promise(r => first = r);
    Cloud.db.collection(COL.st).onSnapshot(snap => {
      Cloud.stats = {}; snap.docs.forEach(d => Cloud.stats[d.id] = d.data());
      regionFeed(); first(); render(false);
    }, () => { first(); toast("Δεν υπάρχει σύνδεση με την κοινή βάση"); });
    Cloud.db.collection(COL.r).onSnapshot(snap => { Cloud.reviews = snap.docs.map(d => d.data()); render(false); }, () => {});
    Cloud.db.collection(COL.ref).onSnapshot(snap => { Cloud.refs = snap.docs.map(d => ({...d.data(), id:d.id})); render(false); }, () => {});
    Cloud.auth.onAuthStateChanged(u => { Cloud.user = u; regionFeed(); findMine(); if (isAdmin()) adminInitStats(); render(false); });
    await Promise.race([ready, new Promise(r => setTimeout(r, 7000))]);
    return true;
  } catch(e){ Cloud.on = false; toast("Δεν φορτώθηκε η κοινή βάση — λειτουργία στη συσκευή"); return false; }
}

function regionFeed(){
  REGIONS.forEach(({id}) => {
    const want = isAdmin() || regionOpen(id);
    if (want && !Cloud.subs[id]){
      Cloud.subs[id] = Cloud.db.collection(COL.reg).doc(id).collection("profiles").onSnapshot(snap => {
        Cloud.byRegion[id] = snap.docs.map(d => ({...d.data(), id:d.id, region:id})); mergeCloud();
      }, () => { Cloud.byRegion[id] = []; });
    } else if (!want && Cloud.subs[id]){ Cloud.subs[id](); delete Cloud.subs[id]; Cloud.byRegion[id] = []; mergeCloud(); }
  });
}

function watchMine(rid){

function mergeCloud(){
  const all = [].concat(...Object.values(Cloud.byRegion));
  if (Cloud.mine && !all.some(p => p.id === Cloud.mine.id)) all.push(Cloud.mine);
  Cloud.profiles = all; reload();
}

const Store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch(e){ return false; } },
  async list(){
    const d = this.load();
    let a = Cloud.on ? Cloud.profiles.map(x => {
          const old = state.all.find(y => y.id === x.id); return old && old._ph && old.updated === x.updated ? {...x, photos:old.photos, _ph:true} : x; })
      : (d.profiles || []).map(fixOld);
    if (this.samples()) a = a.concat(SAMPLES);
    return a;
  },
  async upsert(p){
    if (Cloud.on){
      if (!Cloud.user) return false;
      const db = Cloud.db, uid = Cloud.user.uid, prev = Cloud.mine, rid = regionOf(p.lat, p.lng);
      const st = Cloud.stats[rid], open = !!(st && st.open), moved = !!(prev && prev.region !== rid);
      const o = cleanProfile({...p}); o.uid = uid; o.region = rid; o.updated = Date.now(); o.created = (prev && prev.created) || Date.now();
      if (!isAdmin() || !prev){
        const keep = prev && !moved;
        o.featured = !!(keep && prev.featured); o.verified = !!(keep && prev.verified);
      }
      o.founder = prev ? (!!prev.founder && (!moved || !open)) : !open;           // ιδρυτικό: όσοι γράφτηκαν πριν ανοίξει η περιοχή
      o.refBy = prev ? (prev.refBy || "") : (pendingRef() !== uid ? pendingRef() : "");
      if (!o.refBy) delete o.refBy;
      const b = db.batch(), inc = firebase.firestore.FieldValue.increment;
      b.set(regDoc(rid, uid), o);
      if (moved) b.delete(regDoc(prev.region, uid));
      const wasPro = !!(prev && prev.type === "pro"), isPro = o.type === "pro";
      if (wasPro && (moved || !isPro) && Cloud.stats[prev.region]) b.update(statsDoc(prev.region), {count: inc(-1)});
      const added = isPro && (!wasPro || moved);
      if (added && st) b.update(statsDoc(rid), {count: inc(1)});
      if (!prev && o.refBy && !Cloud.refs.some(r => r.id === uid)) b.set(db.collection(COL.ref).doc(uid), {by:o.refBy, region:rid, at:Date.now()});
      if (p.photos !== undefined) b.set(db.collection(COL.ph).doc(uid), {uid, photos: isFeat({...o, id:uid}) ? (p.photos || []).slice(0, MAX_PHOTOS) : []});
      try { await b.commit(); }
      catch(e){ toast("Η αποθήκευση απέτυχε: " + (e.code || "σφάλμα")); return null; }
      Cloud.mine = {...(prev || {}), ...o, id:uid, region:rid}; mergeCloud();      // να φαίνεται αμέσως, πριν απαντήσει η βάση
      if (!prev || moved) watchMine(rid);
      /* Αυτόματο άνοιγμα της περιοχής όταν πιάσει τον στόχο */
      if (added && st && !st.open && (st.count || 0) + 1 >= (st.goal || 1e9)){
        try { await statsDoc(rid).update({open:true}); toast(`🎉 Ο χάρτης της περιοχής ${regName(rid)} άνοιξε!`); } catch(e){}
      }
      return true;
    }
    const d = this.load(); d.profiles = (d.profiles||[]).filter(x => x.id !== p.id); d.profiles.push(p); d.myId = p.id; return this.save(d);
  },
  async remove(id){
    if (Cloud.on){
      const p = state.all.find(x => x.id === id) || Cloud.mine; if (!p || !p.region) return;
      const b = Cloud.db.batch();
      b.delete(regDoc(p.region, id)); b.delete(Cloud.db.collection(COL.ph).doc(id));
      if (p.type === "pro" && Cloud.stats[p.region]) b.update(statsDoc(p.region), {count: firebase.firestore.FieldValue.increment(-1)});
      try { await b.commit(); if (Cloud.user && id === Cloud.user.uid){ Cloud.mine = null; mergeCloud(); } } catch(e){ toast("Η διαγραφή απέτυχε"); }
      return;
    }
    const d = this.load(); d.profiles = (d.profiles||[]).filter(x => x.id !== id); if (d.myId === id) delete d.myId; this.save(d);
  },
  reviews(p){
    if (Cloud.on) return (p.reviews||[]).concat(Cloud.reviews.filter(r => r.to === p.id).sort((a,b) => String(b.date).localeCompare(String(a.date))));
    const d = this.load(); return (p.reviews||[]).concat(((d.reviews||{})[p.id])||[]);
  },
  async addReview(id, r){
    if (Cloud.on){
      const uid = Cloud.user.uid;
      try { await Cloud.db.collection(COL.r).doc(id + "_" + uid).set({...r, to:id, from:uid}); return true; }
      catch(e){ toast("Η κριτική δεν αποθηκεύτηκε"); return false; }
    }
    const d = this.load(); d.reviews = d.reviews || {}; (d.reviews[id] = d.reviews[id] || []).unshift(r); return this.save(d);
  },
  myId(){
    if (Cloud.on) return Cloud.user && Cloud.mine ? Cloud.user.uid : null;
    return this.load().myId;
  },
  samples(){ const v = this.load().samples; return v === undefined ? !Cloud.on : v !== false; },
  setSamples(v){ const d = this.load(); d.samples = v; this.save(d); },

/* ---------- Κωδικός σάρωσης (QR) — ενσωματωμένος, χωρίς εξωτερική βιβλιοθήκη ---------- */
const QR = (() => {
  const ECC = [0,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24];
  const BLK = [0,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10];
  const mul = (x,y) => { let z=0; for (let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z & 255; };
  const rawMods = v => { let r=(16*v+128)*v+64; if (v>=2){ const n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if (v>=7) r-=36; } return r; };
  const dataCw = v => Math.floor(rawMods(v)/8) - ECC[v]*BLK[v];
  function rsDiv(d){ const r=new Array(d).fill(0); r[d-1]=1; let root=1;
    for (let i=0;i<d;i++){ for (let j=0;j<d;j++){ r[j]=mul(r[j],root); if (j+1<d) r[j]^=r[j+1]; } root=mul(root,2); } return r; }
  function rsRem(data, div){ const r=div.map(()=>0); for (const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>r[i]^=mul(c,f)); } return r; }
  const bit = (x,i) => ((x>>>i)&1) !== 0;
  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for (; v <= 15; v++){ const cc = v<10?8:16; if (4+cc+bytes.length*8 <= dataCw(v)*8) break; }
    if (v > 15) throw new Error("πολύ μεγάλο");
    const bits = []; const push = (val,len) => { for (let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
    push(4,4); push(bytes.length, v<10?8:16); bytes.forEach(b=>push(b,8));
    const cap = dataCw(v)*8;
    push(0, Math.min(4, cap-bits.length)); push(0, (8-bits.length%8)%8);
    for (let p=0xEC; bits.length<cap; p^=0xEC^0x11) push(p,8);
    const data = []; for (let i=0;i<bits.length;i+=8){ let b=0; for (let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }
    const nb=BLK[v], el=ECC[v], raw=Math.floor(rawMods(v)/8), nShort=nb-raw%nb, shortLen=Math.floor(raw/nb), div=rsDiv(el);
    const blocks=[]; for (let i=0,k=0;i<nb;i++){ const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1)); k+=dat.length;
      const ecc=rsRem(dat,div); if (i<nShort) dat.push(0); blocks.push(dat.concat(ecc)); }
    const cw=[]; for (let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if (i!==shortLen-el || j>=nShort) cw.push(b[i]); });
    const size=v*4+17, M=[...Array(size)].map(()=>Array(size).fill(false)), F=[...Array(size)].map(()=>Array(size).fill(false));
    const setF=(x,y,d)=>{ M[y][x]=d; F[y][x]=true; };
    for (let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const finder=(x,y)=>{ for (let dy=-4;dy<=4;dy++) for (let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)), xx=x+dx, yy=y+dy;
      if (xx>=0&&xx<size&&yy>=0&&yy<size) setF(xx,yy,d!==2&&d!==4); } };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    if (v>1){ const n=Math.floor(v/7)+2, step=Math.ceil((v*4+4)/(n*2-2))*2, pos=[6];
      for (let p=size-7; pos.length<n; p-=step) pos.splice(1,0,p);
      pos.forEach((a,i)=>pos.forEach((b,j)=>{ if ((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0)) return;
        for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++) setF(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); })); }
    const format=mask=>{ const d=mask; let r=d; for (let i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537); const b=((d<<10)|r)^0x5412;
      for (let i=0;i<=5;i++) setF(8,i,bit(b,i)); setF(8,7,bit(b,6)); setF(8,8,bit(b,7)); setF(7,8,bit(b,8));
      for (let i=9;i<15;i++) setF(14-i,8,bit(b,i));
      for (let i=0;i<8;i++) setF(size-1-i,8,bit(b,i)); for (let i=8;i<15;i++) setF(8,size-15+i,bit(b,i)); setF(8,size-8,true); };
    format(0);
    if (v>=7){ let r=v; for (let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); const b=(v<<12)|r;
      for (let i=0;i<18;i++){ const d=bit(b,i), a=size-11+i%3, c=Math.floor(i/3); setF(a,c,d); setF(c,a,d); } }
    let k=0; for (let right=size-1; right>=1; right-=2){ if (right===6) right=5;
      for (let vert=0; vert<size; vert++) for (let j=0;j<2;j++){ const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
        if (!F[y][x] && k<cw.length*8){ M[y][x]=bit(cw[k>>>3],7-(k&7)); k++; } } }
    const mf=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{ for (let y=0;y<size;y++) for (let x=0;x<size;x++) if (!F[y][x] && mf[m](x,y)) M[y][x]=!M[y][x]; };
    const penalty=()=>{ let p=0, dark=0;
      for (let a=0;a<size;a++){ let rc=null,rl=0,cc=null,cl=0;
        for (let b=0;b<size;b++){
          if (M[a][b]===rc){ rl++; if (rl===5) p+=3; else if (rl>5) p++; } else { rc=M[a][b]; rl=1; }
          if (M[b][a]===cc){ cl++; if (cl===5) p+=3; else if (cl>5) p++; } else { cc=M[b][a]; cl=1; }
          if (M[a][b]) dark++;
          if (a<size-1 && b<size-1){ const c=M[a][b]; if (c===M[a][b+1]&&c===M[a+1][b]&&c===M[a+1][b+1]) p+=3; } } }
      const t=size*size; p+=(Math.ceil(Math.abs(dark*20-t*10)/t)-1)*10; return p; };
    let best=0, bp=Infinity;
    for (let m=0;m<8;m++){ apply(m); format(m); const p=penalty(); if (p<bp){ bp=p; best=m; } apply(m); }
    apply(best); format(best);
    return M;
  }
  function draw(ctx, text, x, y, s, dark="#17324D"){
    const M = encode(text), n = M.length + 8, u = s / n;
    ctx.fillStyle = "#fff"; ctx.fillRect(x, y, s, s); ctx.fillStyle = dark;
    for (let r=0;r<M.length;r++) for (let c=0;c<M.length;c++) if (M[r][c]) ctx.fillRect(x+(c+4)*u, y+(r+4)*u, u+0.6, u+0.6);
  }
  return { encode, draw };
})();

const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function km(a,b){ const R=6371,r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const fmtKm = d => d < 1 ? Math.round(d*1000) + " μ." : d.toFixed(d<10?1:0).replace(".",",") + " χλμ";

function shrink(file, max=900){
  return new Promise((ok, bad) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",0.72));
    }; im.onerror = bad; im.src = fr.result; };
    fr.onerror = bad; fr.readAsDataURL(file);
  });
}

function origin(){ return state.me || map.getCenter(); }

  const o = origin(), q = norm(state.q);
  return state.all.map(p => ({...p, dist: km(o,p)}))
    .filter(p => type==="all" || (type==="feat" ? isFeat(p) : p.type===type))
    .filter(p => !state.specs.size || tradesOf(p).some(t => state.specs.has(t)))

    .filter(p => !state.radius || p.dist <= state.radius)
    .filter(p => !p.hidden || p.id === Store.myId())
    .sort((a,b) => (isFeat(b)-isFeat(a)) || (founderBoost(b)-founderBoost(a)) || (a.dist-b.dist));
}

    </div>`; }).join("") : (state.all.length ? '<div class="empty">Δεν βρέθηκε κανείς με αυτά τα φίλτρα.<br>Δοκίμασε μεγαλύτερη απόσταση ή άλλο επάγγελμα.</div>' : '<div class="empty"><b>Ο χάρτης μόλις άνοιξε!</b><br>Γίνε ο πρώτος τεχνίτης της περιοχής σου — πάτα «Προφίλ» κάτω δεξιά.</div>');

/* Έλεγχος για νέα έκδοση: παίρνει την τελευταία από τον διακομιστή, χωρίς να σβήνει τα δεδομένα σου */
async function checkUpdate(){
  toast("Έλεγχος για νέα έκδοση…");
  try {
    const r = await fetch("index.html?t=" + Date.now(), {cache:"no-store"});
    const m = (await r.text()).match(/const VERSION = "([^"]+)"/);
    const latest = m ? m[1] : null;
    if (latest && latest === VERSION){ toast("Έχεις ήδη την τελευταία έκδοση (" + VERSION + ")"); return; }
    if ("serviceWorker" in navigator){ const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); }
    if (window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    toast("Ενημέρωση σε έκδοση " + (latest || "νεότερη") + "…");
    setTimeout(() => location.replace(baseUrl() + "?v=" + Date.now()), 600);
  } catch(e){ toast("Δεν υπάρχει σύνδεση — δοκίμασε ξανά"); }
}


/* ---------- Παραλαβή στοιχείων από το Δρομολόγιο ----------
   α) στη διεύθυνση: #km=<κωδικός>  ("z" = συμπιεσμένο JSON, "j" = σκέτο JSON, σε base64url)
   β) στην κοινή αποθήκη του κινητού: localStorage "kontamou_from_dromologio" */
const b64u = s => { s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; const b = atob(s), u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; };

  const k = s[0], u = b64u(s.slice(1)); let raw = u;
  if (k === "z"){ const ds = new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw")); raw = new Uint8Array(await new Response(ds).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(raw));
}
function dromoStored(){ try { const d = JSON.parse(localStorage.getItem("kontamou_from_dromologio") || "null"); return d && d.app === "dromologio" ? d : null; } catch(e){ return null; } }
async function dromoFromHash(){
  const m = location.hash.match(/km=([^&]+)/); if (!m) return null;
  try { const d = await unpackShare(decodeURIComponent(m[1])); return d && d.app === "dromologio" ? d : null; } catch(e){ toast("Ο σύνδεσμος του Δρομολογίου δεν διαβάστηκε"); return null; }
}
function dromoPreset(d){
  const pr = d.prof && profById(d.prof) ? d.prof : "other";
  const o = {fromDromologio:true, dromoAt:d.at || Date.now(), trades:[pr], hidden: d.visible === false, lic: d.lic || null};
  if (pr === "other" && d.profName) o.customName = d.profName;
  ["name","phone","email","area"].forEach(k => { if (d[k]) o[k] = String(d[k]); });
  if (typeof d.lat === "number" && typeof d.lng === "number" && !(Cloud.on && Cloud.mine)){ o.lat = d.lat; o.lng = d.lng; o.approx = false; o.posFromDromo = true; }
  return o;                       // σε υπάρχον προφίλ η ακριβής θέση του δεν αλλάζει
}
/* Αν αλλάξει κάτι στο Δρομολόγιο (π.χ. «να μη φαίνομαι» ή νέο κλειδί Pro), ενημερώνεται μόνο του */
let syncing = false;
async function syncFromDromologio(){
  const d = dromoStored(), me = Cloud.on ? Cloud.mine : null;
  if (!d || !me || syncing || (d.at || 0) <= (me.dromoAt || 0)) return;
  syncing = true;
  const q = {...me, hidden: d.visible === false, lic: d.lic || null, dromoAt: d.at || Date.now()};
  const ok = await Store.upsert(q); syncing = false;
  if (ok) toast(d.visible === false ? "Από το Δρομολόγιο: η πινέζα σου κρύφτηκε" : "Ενημερώθηκαν τα στοιχεία σου από το Δρομολόγιο");
}

async function handleDromoHash(){
  const dh = await dromoFromHash(); if (!dh) return false;
  history.replaceState(null, "", baseUrl());
  openStart(); $("start").hidden = true; setType("pro");
  requireLogin(() => { openForm(Cloud.mine || null, Cloud.mine ? Cloud.mine.type : "pro", dromoPreset(dh));
    toast("Τα στοιχεία ήρθαν από το Δρομολόγιο — έλεγξέ τα και πάτα «Δημοσίευση»"); });
  return true;
}
addEventListener("hashchange", () => { if (/km=/.test(location.hash)) handleDromoHash(); });

/* ---------- Κλειστή περιοχή: ο πελάτης βλέπει πρόοδο αντί για χάρτη ---------- */
function updateSoon(){
  const el = $("soon"); if (!el) return;
  const c = state.me || map.getCenter(), rid = regionOf(c.lat, c.lng), st = Cloud.stats[rid];
  const show = Cloud.on && !isAdmin() && st && !st.open;
  el.hidden = !show; document.body.classList.toggle("soon-on", !!show);
  if (!show) return;
  const n = st.count || 0, g = st.goal || 1, pct = Math.min(100, Math.round(n / g * 100));
  el.innerHTML = `<div class="soon-t">🚧 Ο χάρτης της περιοχής <b>${esc(regName(rid))}</b> ανοίγει σύντομα</div>
    <div class="soon-n">Έχουν δηλωθεί <b>${n}</b> από <b>${g}</b> μάστορες</div>
    <div class="soon-bar"><i style="width:${pct}%"></i></div>
    <div class="soon-s">Όταν συμπληρωθούν, ο χάρτης ανοίγει για όλους μαζί.</div>
    <div class="soon-b"><button id="soonJoin">🏅 Είσαι μάστορας; Γίνε Ιδρυτικό μέλος</button><button id="soonShare">⤴ Πες το σε μάστορα</button></div>`;
  $("soonJoin").onclick = () => requireLogin(() => { const me = Cloud.mine; if (me) openProfile(me.id); else openForm(null, "pro"); });
  $("soonShare").onclick = () => shareText(`Γράψου δωρεάν στο «Κοντά μου» — τον χάρτη με τους μάστορες της γειτονιάς. Οι πρώτοι γίνονται Ιδρυτικά μέλη: ${baseUrl()}`);
}
async function shareText(t){
  try { if (navigator.share) await navigator.share({text:t}); else { await navigator.clipboard.writeText(t); toast("Αντιγράφηκε"); } } catch(e){}
}

/* ---------- Πίνακας διαχειριστή: στόχοι και άνοιγμα περιοχών ---------- */
function openAdmin(){
  const rows = REGIONS.map(r => { const s = Cloud.stats[r.id] || {}; const pct = Math.min(100, Math.round((s.count||0) / (s.goal||r.goal) * 100));
    return `<div class="adm-r" data-r="${r.id}"><div class="adm-h"><b>${esc(r.name)}</b><span class="badge ${s.open ? "seek" : "demo"}">${s.open ? "Ανοιχτή" : "Κλειστή"}</span></div>
      <div class="soon-bar"><i style="width:${pct}%"></i></div>
      <div class="adm-c">Μάστορες: <b>${s.count || 0}</b> · στόχος <input type="number" min="1" max="10000" value="${s.goal || r.goal}" class="adm-g">
      <button class="adm-save">Αποθήκευση</button><button class="adm-open">${s.open ? "Κλείσιμο" : "Άνοιγμα τώρα"}</button></div></div>`; }).join("");
  openModal(`<h2>⚙️ Περιοχές</h2><div class="meta">Ο χάρτης κάθε περιοχής ανοίγει αυτόματα μόλις ο αριθμός των μαστόρων φτάσει τον στόχο.</div>
    ${rows}
    <div class="btns"><button id="admRecount">⟳ Επανυπολογισμός μετρητών</button></div>
    <div class="meta" style="font-size:12.5px">Δημόσια διεύθυνση μετρητή (για το Δρομολόγιο):<br><code style="word-break:break-all">${esc(statsRestUrl("attiki"))}</code></div>
    <div class="btns"><button id="admClose">Κλείσιμο</button></div>`);
  $("admClose").onclick = closeModal;
  $("modalCard").querySelectorAll(".adm-r").forEach(el => {
    const rid = el.dataset.r;
    el.querySelector(".adm-save").onclick = async () => { const g = +el.querySelector(".adm-g").value || 1;
      try { await statsDoc(rid).set({name:regName(rid), goal:g}, {merge:true}); toast("Ο στόχος αποθηκεύτηκε"); openAdmin(); } catch(e){ toast("Δεν επιτρέπεται"); } };
    el.querySelector(".adm-open").onclick = async () => { const s = Cloud.stats[rid] || {};
      try { await statsDoc(rid).set({open:!s.open}, {merge:true}); setTimeout(openAdmin, 300); } catch(e){ toast("Δεν επιτρέπεται"); } };
  });
  $("admRecount").onclick = async () => {
    toast("Μέτρηση…");
    for (const r of REGIONS){
      try { const snap = await Cloud.db.collection(COL.reg).doc(r.id).collection("profiles").get();
        const n = snap.docs.filter(d => d.data().type === "pro").length;
        await statsDoc(r.id).set({name:r.name, count:n}, {merge:true}); } catch(e){}
    }
    toast("Οι μετρητές ενημερώθηκαν"); setTimeout(openAdmin, 300);
  };
}

  if (!st || st.open) return "";

  const d = km(origin(), p);
  if (areaCircle) map.removeLayer(areaCircle);
  if (p.type==="pro" && p.radius) areaCircle = L.circle([p.lat,p.lng],{radius:p.radius*1000,color:"#F2B632",weight:2,fillColor:"#F2B632",fillOpacity:.1,interactive:false}).addTo(map);
  map.panTo([p.lat,p.lng]);

  const ph = phoneIntl(p.phone);

      acts += `<a class="viber" href="viber://chat?number=%2B${ph}">Viber</a>`;
      acts += `<a class="wa" href="https://wa.me/${ph}" target="_blank" rel="noopener">WhatsApp</a>`;
    }
    if (p.email) acts += `<a class="${ph && !p.hidePhone ? "" : "call "}wide" href="mailto:${esc(p.email)}?subject=${encodeURIComponent("Επικοινωνία από «Κοντά μου»")}">✉ Ηλεκτρονικό ταχυδρομείο</a>`;
  }
  acts += `<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">➤ Διαδρομή</a>`;
  acts += `<button id="btnShare">⤴ Κοινοποίηση</button>`;
  if (mine) acts += `<button id="btnEdit" class="call">✎ Αλλαγή στοιχείων</button><button id="btnMove" class="call">📍 Αλλαγή θέσης</button><button id="btnDel" class="danger wide">Διαγραφή προφίλ</button>`;

  const gal = f && p.photos && p.photos.length ? `<div class="sec">Φωτογραφίες από δουλειές</div><div class="gal">${p.photos.map(s=>`<img src="${s}" alt="">`).join("")}</div>` : "";
  let revHtml = "";

    revHtml = `<div class="sec">Κριτικές πελατών ${revs.length?`· <span class="stars">★</span> ${fmtAvg(av)}`:""}</div>`;
    revHtml += revs.length ? revs.map(r=>`<div class="rev"><b>${esc(r.name)}</b> <span class="stars">${starStr(r.stars)}</span> <small class="meta">${fmtDate(r.date)}</small>${r.text?`<p>${esc(r.text)}</p>`:""}</div>`).join("")
                           : '<div class="meta">Δεν υπάρχουν ακόμα κριτικές.</div>';

    catch(e){ toast("Η αναφορά δεν στάλθηκε"); } });

    try { await regDoc(p.region, p.id).update({featured:on, verified:on}); toast(on ? "Ενεργοποιήθηκε η προνομιακή προβολή" : "Αφαιρέθηκε η προνομιακή προβολή"); closeModal(); }

      await reload(); map.setView([q.lat,q.lng], Math.max(map.getZoom(), 16)); openProfile(p.id);
      toast(q.approx ? "Η θέση άλλαξε — φαίνεσαι κατά προσέγγιση (έως 100 μ.). Για ακριβή θέση, βγάλε το «κατά προσέγγιση» από τα στοιχεία." : "Η θέση σου άλλαξε");

  }
  return true;
}

/* ---------- Ψηφιακή κάρτα ---------- */
const FONT = 'system-ui,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif';
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fit(ctx,text,weight,size,maxW){ let s=size; do { ctx.font=`${weight} ${s}px ${FONT}`; s-=2; } while (ctx.measureText(text).width>maxW && s>14); }
function pinGlyph(ctx,x,y,r,fill,hole){
  ctx.beginPath(); ctx.arc(x,y,r,Math.PI*0.78,Math.PI*0.22,false); ctx.lineTo(x,y+r*1.75); ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,r*0.4,0,Math.PI*2); ctx.fillStyle=hole; ctx.fill();
}
function drawCard(cv, p, kind){
  const url = profileUrl(p), f = isFeat(p), revs = Store.reviews(p);
  const contact = !p.hidePhone && p.phone ? "Τηλ. " + phoneNice(p.phone) : (p.email || "");
  const ctx = cv.getContext("2d");
  if (kind === "card"){
    cv.width = 1050; cv.height = 600;
    const g = ctx.createLinearGradient(0,0,1050,600); g.addColorStop(0,"#17324D"); g.addColorStop(1,"#22476B");
    ctx.fillStyle = g; ctx.fillRect(0,0,1050,600);
    ctx.fillStyle = "rgba(255,255,255,.04)"; ctx.beginPath(); ctx.arc(980,640,330,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#F2B632"; ctx.fillRect(0,0,16,600);
    pinGlyph(ctx,74,66,19,"#F2B632","#17324D");
    ctx.fillStyle = "#fff"; ctx.font = `800 30px ${FONT}`; ctx.fillText("Κοντά μου",104,77);
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.font = `500 19px ${FONT}`; ctx.fillText("από το Δρομολόγιο",104,103);
    ctx.fillStyle = "#fff"; fit(ctx,p.name,"800",66,540); ctx.fillText(p.name,56,245);
    ctx.fillStyle = "#F2B632"; fit(ctx,specTxt(p),"700",38,540); ctx.fillText(specTxt(p),56,298);
    ctx.fillStyle = "rgba(255,255,255,.8)"; fit(ctx,p.area,"500",26,540); ctx.fillText(p.area,56,340);
    let y = 388;
    if (f){ ctx.fillStyle = "#F2B632"; ctx.font = `700 22px ${FONT}`;
      const t = "★ Προνομιακός" + (p.verified ? "   ✓ Επαληθευμένος" : "") + (revs.length ? `   ★ ${fmtAvg(avgOf(revs))} (${revs.length})` : "");
      fit(ctx,t,"700",22,540); ctx.fillText(t,56,y); }
    if (contact){ ctx.fillStyle = "#fff"; fit(ctx,contact,"800",38,540); ctx.fillText(contact,56,535); }
    ctx.fillStyle = "#fff"; rrect(ctx,650,100,350,400,24); ctx.fill();
    QR.draw(ctx,url,672,112,306);
    ctx.fillStyle = "#17324D"; ctx.font = `700 21px ${FONT}`; ctx.textAlign = "center";
    ctx.fillText("Σκάναρε με την κάμερα",825,448); ctx.fillStyle = "#5E7185"; ctx.font = `500 17px ${FONT}`;
    ctx.fillText("και δες το προφίλ μου",825,474); ctx.textAlign = "left";
  } else {
    cv.width = 1000; cv.height = 1150;
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,1000,1150);
    const g = ctx.createLinearGradient(0,0,1000,230); g.addColorStop(0,"#17324D"); g.addColorStop(1,"#22476B");
    ctx.fillStyle = g; ctx.fillRect(0,0,1000,230);
    ctx.fillStyle = "#F2B632"; ctx.fillRect(0,224,1000,12);
    ctx.textAlign = "center";
    ctx.fillStyle = "#F2B632"; ctx.font = `800 34px ${FONT}`; ctx.fillText("ΒΡΕΣ ΜΕ ΣΤΟ",500,82);
    pinGlyph(ctx,352,140,26,"#F2B632","#17324D");
    ctx.fillStyle = "#fff"; ctx.font = `800 78px ${FONT}`; ctx.textAlign = "left"; ctx.fillText("Κοντά μου",398,168);
    ctx.textAlign = "center";
    ctx.fillStyle = "#17324D"; fit(ctx,p.name,"800",62,880); ctx.fillText(p.name,500,315);
    ctx.fillStyle = "#A8760B"; fit(ctx,specTxt(p),"700",42,880); ctx.fillText(specTxt(p),500,372);
    QR.draw(ctx,url,230,400,540);
    ctx.fillStyle = "#17324D"; ctx.fillRect(0,960,1000,190);
    ctx.fillStyle = "#fff"; if (contact){ fit(ctx,contact,"800",54,900); ctx.fillText(contact,500,1040); }
    ctx.fillStyle = "#F2B632"; ctx.font = `700 30px ${FONT}`; ctx.fillText("Σκάναρε με την κάμερα του κινητού",500,contact?1100:1070);
    ctx.textAlign = "left";
  }
}

/* ---------- Πίνακας επαγγελμάτων ανά κατηγορία (φίλτρο ή επιλογή στη φόρμα) ---------- */
/* opt.pick: επιλογή για το προφίλ (έως opt.max), αλλιώς φίλτρο αναζήτησης */
function openSpecFilter(opt = {}){
  const pick = !!opt.pick, max = opt.max || 3, sel = new Set(pick ? opt.sel : state.specs), order = pick ? [...opt.sel] : [];
  const base = state.all.filter(p => state.type==="all" || (state.type==="feat" ? isFeat(p) : p.type===state.type));
  const cnt = {}; base.forEach(p => tradesOf(p).forEach(t => cnt[t] = (cnt[t]||0) + 1));
  const cn = n => pick ? "" : `<span class="cn${n?"":" z"}">${n}</span>`;
  let h = `<h2>${pick ? "Η ειδικότητά μου" : "Επαγγέλματα"}</h2>
    <div class="meta">${pick ? `Διάλεξε έως ${max}, όπως στο Δρομολόγιο. Η πρώτη που διαλέγεις φαίνεται στην πινέζα σου.` : "Διάλεξε ένα ή περισσότερα. Το κουτάκι της κατηγορίας τα επιλέγει όλα μαζί. Ο αριθμός δείχνει πόσοι υπάρχουν."}</div>
    <input id="specQ" type="search" placeholder="Γρήγορη εύρεση επαγγέλματος…" style="margin:10px 0 4px">`;
  CATS_D.forEach((c, i) => {
    const list = profsOfCat(c.id); if (!list.length) return;
    const n = list.reduce((s,x) => s + (cnt[x.id]||0), 0), some = list.some(x => sel.has(x.id));
    h += `<div class="cat" data-i="${i}">
      <div class="cathead"><label>${pick ? "" : '<input type="checkbox" class="cc">'} ${esc(c.g)}</label>${cn(n)}<button class="tog">${some?"▲":"▼"}</button></div>
      <div class="catbody" ${some?"":"hidden"}>${list.map(x => `<label class="sp" data-n="${esc(norm(x.n+" "+c.g))}"><input type="checkbox" value="${esc(x.id)}" ${sel.has(x.id)?"checked":""}> ${esc(x.n)} ${cn(cnt[x.id]||0)}</label>`).join("")}</div>
    </div>`;
  });
  h += pick ? `<div class="btns stick"><button id="spClear">Άκυρο</button><button id="spApply" class="go">Επιλογή</button></div>`
            : `<div class="btns stick"><button id="spClear">Όλα τα επαγγέλματα</button><button id="spApply" class="go">Εμφάνιση</button></div>`;
  openModal(h);
  const card = $("modalCard");
  const syncCat = cat => { const cc = cat.querySelector(".cc"); if (!cc) return;
    const boxes = [...cat.querySelectorAll(".sp input")], k = boxes.filter(b => b.checked).length;
    cc.checked = k === boxes.length; cc.indeterminate = k > 0 && k < boxes.length; };
  const setOpen = (cat, open) => { cat.querySelector(".catbody").hidden = !open; cat.querySelector(".tog").textContent = open ? "▲" : "▼"; };
  card.querySelectorAll(".cat").forEach(cat => {
    syncCat(cat);
    cat.querySelector(".tog").onclick = () => setOpen(cat, cat.querySelector(".catbody").hidden);
    const cc = cat.querySelector(".cc");
    if (cc) cc.onchange = e => { cat.querySelectorAll(".sp input").forEach(b => b.checked = e.target.checked); setOpen(cat, true); };
    cat.querySelectorAll(".sp input").forEach(b => b.onchange = () => {
      if (pick && b.checked && card.querySelectorAll(".sp input:checked").length > max){ b.checked = false; toast(`Έως ${max} ειδικότητες`); }
      if (pick){ const i = order.indexOf(b.value); if (b.checked && i < 0) order.push(b.value); if (!b.checked && i >= 0) order.splice(i,1); }
      syncCat(cat);
    });
  });
  $("specQ").oninput = e => {
    const q = norm(e.target.value.trim());
    card.querySelectorAll(".cat").forEach(cat => {
      let any = false;
      cat.querySelectorAll(".sp").forEach(l => { const ok = !q || l.dataset.n.includes(q); l.hidden = !ok; any = any || ok; });
      cat.hidden = !any; if (q) setOpen(cat, any);
    });
  };
  const chosen = () => [...card.querySelectorAll(".sp input:checked")].map(b => b.value);
  if (pick){
    $("spClear").onclick = () => opt.onDone(null);
    $("spApply").onclick = () => { const c = chosen(); if (!c.length) return toast("Διάλεξε τουλάχιστον μία");
      opt.onDone(order.filter(x => c.includes(x)).concat(c.filter(x => !order.includes(x)))); };
    return;
  }
  $("spClear").onclick = () => { state.specs = new Set(); closeModal(); render(); };
  $("spApply").onclick = () => {
    state.specs = new Set(chosen());
    closeModal(); render();
    if (!state.specs.size) return;
    const go = () => { const n = fitNearest(5);
      const w = state.me ? "εσένα" : "αυτή την περιοχή";
      toast(!n ? "Κανείς ακόμα με αυτό το επάγγελμα" : (n === 1 ? `Ο πιο κοντινός σε ${w}` : `Οι ${n} πιο κοντινοί σε ${w}`) + " — απομάκρυνε τον χάρτη για να δεις κι άλλους"); };
    if (state.me) go(); else locate(p => { setMe(p, false); go(); }, go);
  };
}

    $("thumbs").innerHTML = ph.map((s,i)=>`<div><img src="${s}" alt=""><button data-i="${i}">×</button></div>`).join("");
    $("thumbs").querySelectorAll("button").forEach(b => b.onclick = () => { draft.photos.splice(+b.dataset.i,1); drawThumbs(); });
    $("thumbs").querySelectorAll("img").forEach(im => im.onclick = () => showImg(im.src));
  };
  drawThumbs();
  $("fFeat").onchange = e => { $("featBox").hidden = !e.target.checked; };
  $("fPhotos").onchange = async e => {
    draft.photos = draft.photos || [];
    for (const file of [...e.target.files]){
      if (draft.photos.length >= MAX_PHOTOS){ toast(`Έως ${MAX_PHOTOS} φωτογραφίες`); break; }
      try { draft.photos.push(await shrink(file, 800)); } catch(err){ toast("Δεν διαβάστηκε μια φωτογραφία"); }
    }
    e.target.value = ""; drawThumbs();
  };
  $("lGps").onclick = () => locate(pos => { draft = readForm(); draft.lat=pos.lat; draft.lng=pos.lng; $("lStat").textContent="✓ Ορίστηκε από τη θέση σου"; });
  $("lPick").onclick = () => { draft = readForm();
    pickLocation(draft, ll => { draft.lat = ll.lat; draft.lng = ll.lng; drawForm(); $("lStat").textContent = "✓ Ορίστηκε από τον χάρτη"; }, () => drawForm()); };
  $("lFind").onclick = async () => {
    const a = $("fArea").value.trim(); if (!a) return toast("Γράψε πρώτα την περιοχή");
    $("lStat").textContent = "Αναζήτηση…";
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gr&accept-language=el&q="+encodeURIComponent(a));
      const j = await r.json();
      if (!j.length){ $("lStat").textContent = "Δεν βρέθηκε — δοκίμασε «Επιλογή στον χάρτη»"; return; }
      draft = readForm(); draft.lat=+j[0].lat; draft.lng=+j[0].lon;
      map.setView([draft.lat,draft.lng],14);
      $("lStat").textContent = "✓ Βρέθηκε: " + j[0].display_name.split(",").slice(0,3).join(",");
    } catch(e){ $("lStat").textContent = "Χωρίς σύνδεση — δοκίμασε «Επιλογή στον χάρτη»"; }
  };
  $("fSave").onclick = async () => {
    const p = readForm();
    if (!p.name) return toast("Συμπλήρωσε όνομα");
    if (!p.trades || !p.trades.length) return toast("Διάλεξε ειδικότητα");
    if (!p.area) return toast("Συμπλήρωσε περιοχή");
    if (!p.lat) return toast("Όρισε τη θέση σου στον χάρτη");
    if (!p.phone && !p.email) return toast("Βάλε τηλέφωνο ή ηλ. ταχυδρομείο");
    if (p.hidePhone && !p.email) return toast("Αφού κρύβεις το τηλέφωνο, βάλε ηλ. ταχυδρομείο");
    if (p.type==="pro") delete p.job; else { delete p.radius; p.featured = false; }
    if (!p.trades.includes("other")) delete p.customName; else if (!p.customName) return toast("Γράψε το επάγγελμά σου");
    if (!p.featured){ delete p.photos; p.verified = false; } else p.verified = true;
    if (p.approx){ p.lat = Math.round(p.lat*500)/500; p.lng = Math.round(p.lng*500)/500; }   // περίπου ±100 μ.
    p.updated = Date.now(); delete p.sample;
    const ok = await Store.upsert(p);
    if (ok === null) return;
    if (!ok) return toast("Γέμισε ο χώρος αποθήκευσης — αφαίρεσε κάποια φωτογραφία");
    draft = null; await reload();
    map.setView([p.lat,p.lng], Math.max(map.getZoom(), 16)); openProfile(p.id); const saved = state.all.find(x => x.id === p.id) || p;
    toast(Cloud.on && saved.region && !regionOpen(saved.region) ? `Δημοσιεύτηκε!${saved.founder ? " Είσαι 🏅 Ιδρυτικό μέλος." : ""} Θα φαίνεσαι μόλις ανοίξει ο χάρτης της περιοχής σου.`
      : p.approx ? "Αποθηκεύτηκε — φαίνεσαι κατά προσέγγιση (έως 100 μ.)" : "Το προφίλ σου εμφανίζεται στον χάρτη");
  };
}

/* Επιλογή θέσης στον χάρτη */
/* Σταθερή πινέζα στο κέντρο: μετακινείς τον χάρτη από κάτω και πατάς «Εδώ είναι» */
let picking = false, pickDone = null, pickCancelFn = null;
function pickLocation(from, done, cancel){
  closeModal(); picking = true; pickDone = done; pickCancelFn = cancel;
  document.body.classList.add("picking"); $("pickPin").hidden = false; $("pickBanner").hidden = false;
  setTimeout(() => { map.invalidateSize();
    if (from && from.lat) map.setView([from.lat, from.lng], 17);
    else if (state.me) map.setView([state.me.lat, state.me.lng], 17);
    else map.setZoom(Math.max(map.getZoom(), 15)); }, 60);
}
function endPick(){ picking = false; document.body.classList.remove("picking"); $("pickPin").hidden = true; $("pickBanner").hidden = true; setTimeout(() => map.invalidateSize(), 60); }
map.on("click", e => { if (picking) map.panTo(e.latlng); });
$("pickOk").onclick = () => { const c = map.getCenter(), f = pickDone; endPick(); f && f({lat:c.lat, lng:c.lng}); };
$("pickCancel").onclick = () => { const f = pickCancelFn; endPick(); f && f(); };

/* ---------- Η θέση μου ---------- */
function locate(cb, fail){
  if (!navigator.geolocation){ toast("Η συσκευή δεν δίνει θέση"); if (fail) fail(); return; }
  toast("Εντοπισμός θέσης…");
  navigator.geolocation.getCurrentPosition(
    pos => cb({lat:pos.coords.latitude, lng:pos.coords.longitude}),
    () => { toast("Δεν επιτράπηκε η πρόσβαση στη θέση"); if (fail) fail(); },
    {enableHighAccuracy:true, timeout:12000});
}
function setMe(p, move = true){
  state.me = p; $("btnLoc").classList.add("on");
  if (meMarker) map.removeLayer(meMarker);
  meMarker = L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:'<div class="medot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(map);
  if (move) map.setView([p.lat,p.lng],13);
  render();
}
/* Εστιάζει στους n πιο κοντινούς από τα τρέχοντα αποτελέσματα (και στη θέση σου) */
function fitNearest(n){
  const o = origin(), all = filtered().sort((a,b) => a.dist - b.dist);
  if (!all.length) return 0;
  const lim = Math.max(3, all[0].dist * 3);                     // όχι όσους είναι πολύ πιο μακριά από τον πρώτο
  const near = all.filter((p,i) => i === 0 || p.dist <= lim).slice(0, n);
  const pts = near.map(p => [p.lat, p.lng]); pts.push([o.lat, o.lng]);
  map.fitBounds(L.latLngBounds(pts), {padding:[60,60], maxZoom:16});
  return near.length;
}
$("btnLoc").onclick = () => locate(p => setMe(p));

/* ---------- Φίλτρα ---------- */
document.querySelectorAll("#nav button[data-t]").forEach(c => c.onclick = () => {
  document.querySelectorAll("#nav button[data-t]").forEach(x=>x.classList.remove("on")); c.classList.add("on");
  state.type = c.dataset.t; render();
});
$("btnSpec").onclick = openSpecFilter;
$("radius").onchange = e => { state.radius = +e.target.value; render(); };
let qt; $("q").oninput = e => { clearTimeout(qt); qt = setTimeout(()=>{ state.q = e.target.value; render(); },200); };
map.on("moveend", () => { if (!state.me && !picking) render(state.radius > 0); });
$("sheetHead").onclick = () => { const s=$("sheet"); s.classList.toggle("open"); $("arrow").textContent = s.classList.contains("open")?"Χάρτης ▼":"Λίστα ▲"; setTimeout(()=>map.invalidateSize(),300); };
$("logoHome").onclick = openStart;
$("navMe").onclick = () => requireLogin(() => { const id = Store.myId(); if (id && state.all.some(p=>p.id===id)) openProfile(id); else openForm(null); });


/* ---------- Κουμπί «πίσω» του κινητού: κλείνει ό,τι είναι ανοιχτό, δεν βγάζει από την εφαρμογή ---------- */
let lastBack = 0;
history.replaceState({k:"root"}, "");
history.pushState({k:"app"}, "");
addEventListener("popstate", () => {
  const stay = () => history.pushState({k:"app"}, "");
  if (picking){ $("pickCancel").click(); return stay(); }
  if (!$("viewer").hidden){ $("viewer").hidden = true; return stay(); }
  if (!$("modal").hidden){ closeModal(); draft = null; return stay(); }
  if ($("sheet").classList.contains("open")){ $("sheetHead").click(); return stay(); }
  if ($("start").hidden){ openStart(); return stay(); }
  if (Date.now() - lastBack < 2000) { history.back(); return; }      // δεύτερο «πίσω» μέσα σε 2″: έξοδος
  lastBack = Date.now(); toast("Πάτα ξανά «πίσω» για έξοδο"); stay();
});

/* ---------- Εκκίνηση (με συνδέσμους ?p=… και ?neo=1) ---------- */
(async () => {
  captureRef();
  await cloudInit();
  await reload();
  const q = new URLSearchParams(location.search);
  if (await handleDromoHash()){
  } else if (q.get("p")){
    if (!openProfile(q.get("p"))) { openStart(); toast("Το προφίλ δεν βρέθηκε σε αυτή τη συσκευή"); }
  } else if (q.get("apo") === "dromologio" || q.get("prof")){
    /* Κουμπί από το Δρομολόγιο: ?apo=dromologio&prof=electric,solar&pn=…&n=…&ph=…&a=…&e=… */
    const ids = (q.get("prof") || "").split(",").map(x => x.trim()).filter(Boolean).slice(0,3);
    const trades = ids.map(id => profById(id) ? id : "other").filter((v,i,a) => a.indexOf(v) === i);
    const preset = {fromDromologio:true};
    if (trades.length) preset.trades = trades;
    if (q.get("pn")) preset.customName = q.get("pn");
    const mine = state.all.find(p => p.id === Store.myId());
    const put = (k, v) => { if (v && !(mine && mine[k])) preset[k] = v; };
    put("name", q.get("n")); put("phone", q.get("ph")); put("area", q.get("a")); put("email", q.get("e"));
    openForm(mine || null, mine ? mine.type : "pro", preset);
    toast("Τα στοιχεία ήρθαν από το Δρομολόγιο — όρισε τη θέση σου και πάτα Αποθήκευση");
  } else if (q.get("neo")){
    openForm(null, q.get("neo") === "seek" ? "seek" : "pro");
  } else {
    openStart();
    if (q.get("ref")) toast("Σε προσκάλεσε συνάδελφος — γράψου δωρεάν με το «Είμαι μάστορας»");
  }
  if (q.toString()) history.replaceState(null, "", baseUrl());
  /* Φορτώνει τη ζωντανή λίστα επαγγελμάτων του Δρομολογίου, για να εμφανίζονται και τα νέα */
  const sc = document.createElement("script");
  sc.src = "https://aglentzakis-dot.github.io/dromologio/listes-epaggelmaton.js";
  sc.onload = mergeLiveTrades; document.body.appendChild(sc);
})();
</script>
