name: Ανοιχτά δεδομένα OpenStreetMap — Βιβλία & Πολιτισμός
# Μία φορά τον μήνα κατεβάζει βιβλιοπωλεία και βιβλιοθήκες της Ελλάδας από το OpenStreetMap
# σε ένα στατικό αρχείο (politismos-osm.json). Έτσι η εφαρμογή δεν ρωτά ποτέ τρίτο διακομιστή
# με τη θέση του χρήστη. Δεδομένα: © συντελεστές OpenStreetMap, άδεια ODbL.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/politismos-osm.yml"]
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Λήψη και μετατροπή
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          q = '[out:json][timeout:180];area["ISO3166-1"="GR"][admin_level=2]->.gr;(nwr["shop"="books"](area.gr);nwr["amenity"="library"](area.gr););out center tags;'
          data = urllib.parse.urlencode({"data": q}).encode()
          req = urllib.request.Request("https://overpass-api.de/api/interpreter", data=data, headers={"User-Agent": "GlenApps-KontaMou/1.0 (monthly open-data refresh)"})
          els = json.load(urllib.request.urlopen(req, timeout=240)).get("elements", [])
          out = []
          for e in els:
              t = e.get("tags", {}); lat = e.get("lat", (e.get("center") or {}).get("lat")); lng = e.get("lon", (e.get("center") or {}).get("lon"))
              n = (t.get("name:el") or t.get("name") or "").strip()
              if lat is None or lng is None or not n: continue
              if not (34 < lat < 42 and 19 < lng < 30): continue
              k = "books" if t.get("shop") == "books" else "library"
              a = " ".join(x for x in [t.get("addr:street", ""), t.get("addr:housenumber", "")] if x).strip()
              city = t.get("addr:city", "")
              a = (a + (", " if a and city else "") + city)[:100]
              w = (t.get("website") or t.get("contact:website") or "").strip()
              it = {"k": k, "n": n[:80], "lat": round(lat, 5), "lng": round(lng, 5)}
              if a: it["a"] = a
              if w.startswith("https://") and len(w) <= 200 and not any(c in w for c in ' <>"'): it["w"] = w
              h = (t.get("opening_hours") or "").strip()
              if h and len(h) <= 120: it["h"] = h
              out.append(it)
          out.sort(key=lambda x: (x["k"], x["n"]))
          doc = {"source": "OpenStreetMap", "license": "ODbL 1.0 — © συντελεστές OpenStreetMap", "updated": datetime.date.today().isoformat(), "items": out}
          if len(out) < 50: raise SystemExit("Πολύ λίγα αποτελέσματα (%d) — δεν αντικαθίσταται το αρχείο" % len(out))
          json.dump(doc, open("politismos-osm.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("σημεία:", len(out))
          PY
      - name: Αποθήκευση
        run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          git add politismos-osm.json
          git diff --cached --quiet || (git commit -m "Ανανέωση ανοιχτών δεδομένων OpenStreetMap (Βιβλία & Πολιτισμός)" && git push)
