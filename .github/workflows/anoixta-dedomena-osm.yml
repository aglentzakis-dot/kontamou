name: Ανοιχτά δεδομένα OpenStreetMap — καταστήματα ανά κόσμο
# Μία φορά την εβδομάδα κατεβάζει από το OpenStreetMap καταστήματα και χώρους της Ελλάδας σε στατικά αρχεία
# (ένα ανά κόσμο). Έτσι η εφαρμογή δεν ρωτά ποτέ τρίτο διακομιστή με τη θέση του χρήστη.
# Δεδομένα: © συντελεστές OpenStreetMap, άδεια ODbL.
# Ένα αίτημα ανά αρχείο· αν αποτύχει, μένει το προηγούμενο αρχείο. Κάθε αρχείο αποθηκεύεται μόλις κατέβει.
# Εξαιρέσεις: οι κωδικοί του exaireseis.json (αφαιρέσεις μετά από επιβεβαιωμένο αίτημα) δεν μπαίνουν ποτέ στα αρχεία.
# Δικλίδα: αν λείπει πάνω από το 10% των σημείων σε σχέση με το προηγούμενο αρχείο, ή το αποτέλεσμα είναι χαλασμένο,
# το αρχείο ΔΕΝ ενημερώνεται και η εργασία τελειώνει με αποτυχία — το GitHub στέλνει ειδοποίηση με email.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/anoixta-dedomena-osm.yml", "exaireseis.json"]
permissions:
  contents: write
concurrency:
  group: osm-data
  cancel-in-progress: true
jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Λήψη, μετατροπή και αποθήκευση
        run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          python3 - <<'PY'
          import json, re, os, sys, urllib.request, urllib.parse, datetime, time, subprocess
          norm = lambda v: re.sub(r"[^a-z0-9]", "", str(v or "").lower())[:24]
          EXC = set(norm(e.get("id")) for e in json.load(open("exaireseis.json", encoding="utf-8")).get("items", []) if isinstance(e, dict))
          EXC.discard(""); print("εξαιρέσεις:", len(EXC), flush=True)
          PROBLEMS = []
          # είδος: [(κλειδί OSM, τιμή ή κανονική έκφραση)]
          SETS = {
            "politismos-osm.json": {"books": [("shop", "books")], "library": [("amenity", "library")]},
            "katoikidia-osm.json": {"pet": [("shop", "pet")], "vet": [("amenity", "veterinary")], "groom": [("shop", "pet_grooming")],
                                    "dogpark": [("leisure", "dog_park")], "shelter": [("amenity", "animal_shelter")]},
            "autokinito-osm.json": {"repair": [("shop", "car_repair")], "tyres": [("shop", "tyres")], "wash": [("amenity", "car_wash")],
                                    "parts": [("shop", "car_parts")], "dealer": [("shop", "car")], "moto": [("shop", "motorcycle")],
                                    "ktep": [("amenity", "vehicle_inspection")], "fuel": [("amenity", "fuel")], "ev": [("amenity", "charging_station")],
                                    "rent": [("amenity", "car_rental")], "school": [("amenity", "driving_school")]},
            "mastores-osm.json": {"hw": [("shop", "hardware|doityourself")], "trade": [("shop", "trade")], "paint": [("shop", "paint")],
                                  "elec": [("shop", "electrical")], "bath": [("shop", "bathroom_furnishing")], "tiles": [("shop", "tiles")],
                                  "lock": [("shop", "locksmith"), ("craft", "locksmith")], "glass": [("shop", "glaziery"), ("craft", "glaziery")],
                                  "wood": [("craft", "carpenter|joiner|cabinet_maker")], "metal": [("craft", "metal_construction|blacksmith|welder")],
                                  "electrician": [("craft", "electrician")], "plumber": [("craft", "plumber")], "hvac": [("craft", "hvac")],
                                  "pc": [("shop", "computer")], "appl": [("shop", "appliance")]},
            # «Βόλτες & φύση»: δημόσιοι χώροι, κανένα προσωπικό δεδομένο
            "voltes-osm.json": {"beach": [("natural", "beach")], "trail": [("route", "hiking")], "spring": [("natural", "spring")],
                                "fall": [("waterway", "waterfall")], "view": [("tourism", "viewpoint")], "play": [("leisure", "playground")],
                                "park": [("leisure", "park")], "fountain": [("amenity", "drinking_water")]},
          }
          NAMELESS = {"dogpark", "beach", "spring", "fall", "view", "play", "fountain"}   # σημεία που συνήθως δεν έχουν όνομα
          URLS = ["https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]
          def fetch(q):
              data = urllib.parse.urlencode({"data": q}).encode()
              for rnd in range(2):
                  for url in URLS:
                      try:
                          req = urllib.request.Request(url, data=data, headers={"User-Agent": "GlenApps-KontaMou/1.0 (monthly open-data refresh)", "Content-Type": "application/x-www-form-urlencoded"})
                          els = json.load(urllib.request.urlopen(req, timeout=200)).get("elements", [])
                          print("πηγή:", url, "στοιχεία:", len(els), flush=True); return els
                      except Exception as ex:
                          print("αποτυχία", url, rnd, repr(ex)[:160], flush=True); time.sleep(15)
                  time.sleep(60)
              return None
          for fname, kinds in SETS.items():
              sel = "".join('nwr["%s"~"^(%s)$"](area.gr);' % (key, val) for rules in kinds.values() for key, val in rules)
              q = '[out:json][timeout:180];area["ISO3166-1"="GR"][admin_level=2]->.gr;(' + sel + ');out center tags;'
              els = fetch(q)
              if els is None: PROBLEMS.append(fname + ": η λήψη απέτυχε"); print(fname, "— απέτυχε, μένει το προηγούμενο αρχείο", flush=True); continue
              out = []
              for e in els:
                  t = e.get("tags", {})
                  k = next((kk for kk, rules in kinds.items() if any(re.fullmatch(val, t.get(key, "")) for key, val in rules)), None)
                  if not k: continue
                  lat = e.get("lat", (e.get("center") or {}).get("lat")); lng = e.get("lon", (e.get("center") or {}).get("lon"))
                  n = (t.get("name:el") or t.get("name") or t.get("brand") or t.get("operator") or "").strip()
                  if lat is None or lng is None: continue
                  if not n and k not in NAMELESS: continue
                  if not (34 < lat < 42 and 19 < lng < 30): continue
                  a = " ".join(x for x in [t.get("addr:street", ""), t.get("addr:housenumber", "")] if x).strip()
                  city = t.get("addr:city", "")
                  a = (a + (", " if a and city else "") + city)[:100]
                  w = (t.get("website") or t.get("contact:website") or "").strip()
                  it = {"id": e.get("type", "x")[0] + str(e.get("id", "")), "k": k, "n": n[:80], "lat": round(lat, 5), "lng": round(lng, 5)}
                  if a: it["a"] = a
                  if w.startswith("https://") and len(w) <= 200 and not any(c in w for c in ' <>"'): it["w"] = w
                  h = (t.get("opening_hours") or "").strip()
                  if h and len(h) <= 120: it["h"] = h
                  out.append(it)
              seen = set(); uniq = []
              for it in out:
                  if it["id"] in seen: continue
                  seen.add(it["id"]); uniq.append(it)
              uniq = [x for x in uniq if norm(x["id"]) not in EXC]
              uniq.sort(key=lambda x: (x["k"], x["n"]))
              prev = 0
              try:
                  if os.path.exists(fname): prev = sum(1 for x in json.load(open(fname, encoding="utf-8")).get("items", []) if norm(x.get("id")) not in EXC)
              except Exception: prev = 0
              broken = len(uniq) < 50 or any(not isinstance(x.get("lat"), float) or not x.get("k") in kinds for x in uniq)
              if broken or (prev and len(uniq) < prev * 0.9):
                  msg = "%s: %d σημεία αντί για %d%s — ΔΕΝ ενημερώνεται" % (fname, len(uniq), prev, " (χαλασμένο αποτέλεσμα)" if broken else " (λείπει πάνω από 10%)")
                  PROBLEMS.append(msg); print(msg, flush=True); continue
              # τα προηγούμενα αρχεία καθαρίζονται από νέες εξαιρέσεις ακόμη κι αν δεν άλλαξε τίποτε άλλο
              doc = {"source": "OpenStreetMap", "license": "ODbL 1.0 — © συντελεστές OpenStreetMap", "updated": datetime.date.today().isoformat(), "items": uniq}
              json.dump(doc, open(fname, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              cnt = {}
              for x in uniq: cnt[x["k"]] = cnt.get(x["k"], 0) + 1
              print(fname, "σημεία:", len(uniq), cnt, flush=True)
              subprocess.run(["git", "add", fname], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode:
                  subprocess.run(["git", "commit", "-q", "-m", "Ανανέωση ανοιχτών δεδομένων OpenStreetMap: " + fname], check=True)
                  for _ in range(3):
                      if subprocess.run(["git", "pull", "-q", "--rebase"]).returncode == 0 and subprocess.run(["git", "push", "-q"]).returncode == 0: break
                      time.sleep(5)
              time.sleep(20)
          # εξαιρέσεις και σε αρχεία που δεν ανανεώθηκαν απόψε (π.χ. αποτυχία λήψης)
          for fname in SETS:
              try: d = json.load(open(fname, encoding="utf-8"))
              except Exception: continue
              keep = [x for x in d.get("items", []) if norm(x.get("id")) not in EXC]
              if len(keep) != len(d.get("items", [])):
                  d["items"] = keep; json.dump(d, open(fname, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
                  subprocess.run(["git", "add", fname], check=True)
                  subprocess.run(["git", "commit", "-q", "-m", "Εξαιρέσεις ανοιχτών δεδομένων: " + fname], check=True)
                  for _ in range(3):
                      if subprocess.run(["git", "pull", "-q", "--rebase"]).returncode == 0 and subprocess.run(["git", "push", "-q"]).returncode == 0: break
                      time.sleep(5)
          if PROBLEMS:
              print("ΠΡΟΒΛΗΜΑΤΑ:\n" + "\n".join(PROBLEMS), flush=True); sys.exit(1)
          PY
